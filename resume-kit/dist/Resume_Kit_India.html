<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4D3A'/%3E%3Cpath d='M20 12h18l10 10v28a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3Cpath d='M23 30h18M23 37h18M23 44h11' stroke='%231F4D3A' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='47' cy='47' r='10' fill='%23D98E04'/%3E%3C/svg%3E">
<style>
:root {
  --forest: #1F4D3A; --forest-2: #2B6650; --ivory: #FBF8F1; --card: #FFFFFF; --ink: #1D2A23; --muted: #5E6B63;
  --line: #E4DED0; --amber: #D98E04; --amber-bg: #FFF4DD; --green-bg: #E6F2EA; --green: #1E7A46; --red: #B3261E; --red-bg: #FCE8E6;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(31,77,58,.07);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Malayalam", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ivory); color: var(--ink); font: 16px/1.45 var(--font); padding-bottom: 76px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--forest-2); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--forest); color: #fff; }
.top .logo { width: 34px; height: 34px; border-radius: 9px; background: #fff; display: grid; place-items: center; flex: none; }
.top .t { flex: 1; min-width: 0; }
.top .t b { display: block; font-size: 17px; letter-spacing: .1px; }
.top .t span { display: block; font-size: 12.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { min-width: 44px; min-height: 44px; border: 0; border-radius: 12px; background: transparent; display: grid; place-items: center; cursor: pointer; }
.top .icon-btn { color: #fff; }
.icon-btn:disabled { opacity: .25; cursor: default; }
.showbox { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 650; color: var(--muted); padding: 0 4px; cursor: pointer; min-width: 44px; }
.showbox input { width: 22px; height: 22px; accent-color: var(--forest); margin: 0 0 2px; }
.top .icon-btn:hover { background: rgba(255,255,255,.12); }

/* ---------- layout ---------- */
main { max-width: 760px; margin: 0 auto; padding: 14px 14px 24px; }
h2.view-title { font-size: 21px; margin: 6px 2px 4px; color: var(--forest); }
p.view-sub { margin: 0 2px 14px; color: var(--muted); font-size: 14.5px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 16.5px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }

/* ---------- buttons ---------- */
.btn { min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--forest); background: #fff; color: var(--forest); font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--forest); color: #fff; }
.btn.amber { background: var(--amber); border-color: var(--amber); color: #fff; }
.btn.ghost { border-color: var(--line); color: var(--ink); background: #fff; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkish { border: 0; background: none; color: var(--forest-2); text-decoration: underline; cursor: pointer; padding: 6px 2px; min-height: 36px; font-size: 14px; }

/* ---------- forms ---------- */
label.f { display: block; font-size: 13.5px; font-weight: 650; color: var(--muted); margin: 10px 0 4px; }
input.i, textarea.i, select.i { width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: #fff; }
textarea.i { min-height: 92px; resize: vertical; }
input.i:focus, textarea.i:focus, select.i:focus { border-color: var(--forest-2); outline: none; box-shadow: 0 0 0 3px rgba(43,102,80,.15); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 8px; }
.tip { margin: 2px 0 8px; font-size: 13.5px; color: var(--muted); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; min-height: 44px; }
.switch input { width: 46px; height: 26px; accent-color: var(--forest); }

/* ---------- section cards in Build ---------- */
.sec { padding: 0; overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; min-height: 56px; }
.sec-head .name { flex: 1; font-weight: 700; font-size: 16px; background: none; border: 0; text-align: left; padding: 8px 0; cursor: pointer; min-height: 44px; }
.sec-head .name small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
.sec.hiddensec .sec-head .name { color: var(--muted); text-decoration: line-through; }
.sec-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.entry { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 12px; margin-top: 12px; background: #FDFCF8; }
.entry-head { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.entry-head b { font-size: 14px; color: var(--muted); }
.bul { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; }
.bul textarea { min-height: 64px; }
.bul .tools { display: flex; flex-direction: column; }
.bul .tools .icon-btn { min-height: 34px; min-width: 40px; color: var(--muted); }
.hint { font-size: 13px; color: var(--amber); margin-top: 6px; }
.ex-box { margin-top: 8px; background: var(--amber-bg); border-radius: 12px; padding: 8px 12px; }
.ex-box .ex { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed #EAD9B2; font-size: 14px; }
.ex-box .ex:last-child { border-bottom: 0; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border-radius: 999px; font-size: 14.5px; font-weight: 600; border: 1.5px solid; cursor: pointer; background: #fff; }
.chip.missing { border-color: var(--amber); background: var(--amber-bg); color: #6E4700; }
.chip.found { border-color: #9CCBAE; background: var(--green-bg); color: var(--green); cursor: default; }
.chip .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; opacity: .8; }

/* ---------- lists ---------- */
.rlist .item { display: flex; gap: 10px; align-items: center; }
.rlist .item .meta { flex: 1; min-width: 0; }
.rlist .item .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--green-bg); color: var(--green); }
.badge.amber { background: var(--amber-bg); color: #6E4700; }
.layout-card { width: 100%; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 14px; margin-top: 10px; cursor: pointer; min-height: 64px; }
.layout-card:hover { border-color: var(--forest-2); }
.layout-card b { display: block; font-size: 16px; color: var(--forest); }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.steps3 div { background: var(--green-bg); border-radius: 12px; padding: 10px 8px; text-align: center; font-size: 13.5px; font-weight: 650; color: var(--forest); }
.steps3 div span { display: block; font-size: 20px; }
.promise { background: var(--amber-bg); color: #6E4700; border-radius: 12px; padding: 10px 12px; font-weight: 650; font-size: 14.5px; }

/* ---------- checklist ---------- */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check .st { flex: none; min-width: 64px; text-align: center; font-size: 12px; font-weight: 800; padding: 4px 6px; border-radius: 8px; }
.st.ok { background: var(--green-bg); color: var(--green); }
.st.fix { background: var(--amber-bg); color: #6E4700; }
.st.info { background: #EEF0EE; color: var(--muted); }
.check b { display: block; }
pre.plain { white-space: pre-wrap; word-break: break-word; background: #F6F4EE; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; max-height: 340px; overflow: auto; margin: 8px 0; }

/* ---------- tabs (segmented) ---------- */
.seg { display: flex; background: #EFEBE1; border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 650; font-size: 14px; cursor: pointer; }
.seg button.on { background: #fff; color: var(--forest); box-shadow: var(--shadow); }
ol.guide { margin: 10px 0 0; padding-left: 22px; }
ol.guide li { margin: 6px 0; }

/* ---------- banners, toast, dialogs ---------- */
.banner { max-width: 760px; margin: 10px auto 0; padding: 10px 14px; border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.banner.warn { background: var(--red-bg); color: var(--red); }
.banner.info { background: var(--amber-bg); color: #6E4700; }
.toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: #1D2A23; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14.5px; z-index: 60; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.overlay { position: fixed; inset: 0; background: rgba(16,24,20,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--ivory); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px 16px 24px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sheet-head h3 { margin: 0; font-size: 18px; color: var(--forest); }
.menu-item { display: flex; width: 100%; align-items: center; gap: 12px; padding: 12px; min-height: 52px; border: 0; background: #fff; border-radius: 12px; margin-top: 8px; text-align: left; cursor: pointer; font-weight: 600; }

/* ---------- preview ---------- */
.paper-wrap { overflow: hidden; background: #DAD6CC; border-radius: 12px; padding: 10px; }
.paper { width: 794px; min-height: 1123px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.2); padding: 45px 53px; transform-origin: top left; }
.page-line { position: relative; }

/* ---------- bottom tabs ---------- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { min-height: 62px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 650; color: var(--muted); cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--forest); }
nav.tabs button.on svg { stroke: var(--forest); }
@media (min-width: 900px) {
  body { padding-bottom: 0; padding-left: 210px; }
  nav.tabs { top: 56px; right: auto; width: 210px; grid-template-columns: 1fr; grid-auto-rows: 58px; border-top: 0; border-right: 1px solid var(--line); align-content: start; padding-top: 10px; }
  nav.tabs button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 22px; font-size: 15px; min-height: 52px; }
  .top { margin-left: -210px; }
  .toast { bottom: 24px; }
  .overlay { align-items: center; }
  .sheet { border-radius: 20px; }
}
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }

/* ---------- the resume itself (screen preview + print) ---------- */
.rv { font-family: Calibri, Carlito, Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.32; color: #000; }
.rv-head { text-align: center; margin-bottom: 6pt; }
.rv-head::after { content: ""; display: table; clear: both; }
.rv-photo { float: right; width: 26mm; height: auto; margin: 0 0 4pt 8pt; }
.rv-name { font-size: 18pt; margin: 0 0 2pt; font-weight: 700; }
.rv-contact { margin: 0; font-size: 10pt; }
.rv-headline { margin: 2pt 0 0; font-style: italic; }
.rv-sec { margin-top: 7pt; }
.rv-h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: .3pt; margin: 0 0 3pt; padding-bottom: 1.5pt; border-bottom: 1px solid #000; break-after: avoid; page-break-after: avoid; }
.rv-p { margin: 0 0 2pt; }
.rv-row { margin: 3pt 0 1pt; }
.rv-strong { font-weight: 700; }
.rv-ul { margin: 0 0 3pt; padding-left: 14pt; }
.rv-ul li { margin: 0 0 1pt; }
.rv-measure { position: absolute; left: -9999px; top: 0; width: 182mm; visibility: hidden; }

#printArea { display: none; }
@page { size: A4; margin: 12mm 14mm; }
@media print {
  html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
}

</style>

<body>
<script>
// Verified on 2026-11-27: no external facts used.
const CONFIG = {
  "productName": "ATS Resume Kit",
  "region": "IN",
  "paper": "A4",
  "maxResumes": 20,
  "backupReminderDays": 7,
  "storageKey": "wiz_resumekit_v1",
  "version": "1.0.0",
  "crossSell": {
    "jobTracker": "https://wizdesigns.vercel.app/job-hunt-tracker.html",
    "ctc": "https://wizdesigns.vercel.app/offer-check.html",
    "star": "",
    "bundle": ""
  }
};
const CONTENT = {"layoutBlurbs":{"fresher":"Final-year students and freshers with no full-time job yet","serviceIT":"Freshers applying to IT service companies and tech roles","nonIT":"Commerce, arts, science and other non-IT roles","govt":"Government, PSU and other jobs where the form asks for personal details","careerBreak":"Coming back to work after a gap"},"tips":{"personal":"Use one phone number and an email that looks professional (your name, not a nickname). City is enough; skip your full home address.","headline":"One line that says what you are and what you're looking for. You can reuse it as your Naukri and LinkedIn headline.","summary":"2–3 short lines: your degree or current role, your strongest skills, and the kind of job you want. Write it for this job, not for every job.","education":"Newest first. Add your CGPA, and your 12th and 10th marks if they're good or the job asks for them; many Indian job filters read these.","skills":"List only what you can talk about in an interview. Put the skills the job post asks for first.","projects":"Say what you built, what you used, and what it did. Start each bullet with an action word like Built, Designed or Tested.","internships":"Even a short or unpaid internship counts. Write what you worked on, not just the company name.","experience":"Newest first. 3–5 bullets each, about what you did and what changed because of it.","certifications":"Name, who gave it, and the year. Leave out ones that have nothing to do with this job.","achievements":"Ranks, prizes, scholarships, hackathons, sports or arts at college or state level.","activities":"Clubs, NSS/NCC, volunteering, college fests, or anything where you organised or led something.","languages":"List the languages you can speak or write, e.g. English, Malayalam, Hindi.","courses":"Courses or certificates you did during the break show you kept learning. Add the year.","breakNote":"One honest line is enough, e.g. 'Took a career break (2023–2025) for family reasons; now returning to full-time work.' No long explanations."},"examples":{"headline":["B.Tech Computer Science fresher | Python, SQL, Power BI | Looking for data analyst roles","B.Com graduate | Tally, GST, MS Excel | Seeking accounts executive roles in Kochi","Mechanical engineer (2025) | AutoCAD, SolidWorks | Open to design and production roles"],"summary":["B.Tech Computer Science graduate (2025) with hands-on projects in Python and SQL. Built a student attendance dashboard used by my department. Looking for an entry-level data analyst role.","B.Com graduate with a 3-month internship in accounts, comfortable with Tally, GST returns and MS Excel. Looking for an accounts executive role.","Software tester with 2 years' experience, returning after a career break (2023–2025) during which I completed an ISTQB Foundation course. Looking for a QA role."],"projects":["Built a web app in Python and Flask that tracks student attendance; used by 3 classes in my department.","Designed a SQL database for a college library with 5,000+ books, and wrote queries for issue and return reports.","Created a Power BI dashboard showing monthly sales for a local shop, using its billing data in Excel."],"internships":["Tested 4 modules of a billing app during a 2-month internship and logged 30+ bugs in Jira.","Prepared weekly sales reports in Excel for the regional office during a summer internship."],"experience":["Handled GST filing and monthly reconciliation for 25 small-business clients.","Reduced report preparation time from 2 days to half a day by setting up Excel templates."],"achievements":["University rank 12 in B.Tech Computer Science (2025)","Winner, college hackathon (2024), team of 3"],"activities":["NSS volunteer: organised a blood donation camp with 120 donors (2024)","Coordinator, technical fest at my college (2023)"],"courses":["Google Data Analytics Certificate, Coursera (2024)","Advanced Excel, NIELIT (2024)"]},"checklistNotes":{"onePage":"For freshers, one page is enough. Recruiters skim; a second page usually doesn't get read.","contact":"Phone and email as plain text, so software and people can copy them. No icons.","headings":"Standard headings like Education, Skills and Projects are what software and recruiters look for.","photo":"Private companies don't need a photo. Government forms usually have their own photo field.","bullets":"3–5 bullets per project or job is easy to read. One bullet looks thin; eight is too long.","dates":"Write all dates the same way, e.g. 'Jun 2024' everywhere.","fileName":"Name the file with your name, so it's easy to find in a recruiter's inbox."},"howToUse":["Tap New resume and pick the layout closest to your situation.","Fill in each section in Build. Tap See an example when you're stuck, then change it to your own words.","Before applying, open Tailor, paste the job post and see which of its words your resume doesn't use. Add only the ones that are true for you, and save a copy for that job.","Open Check and fix anything marked. Run the copy-paste test on your PDF.","Open Export, save the PDF and Word file, and back up your data from More once a week."],"videoUrl":"","govtNote":"Many government forms ask for these in their own fields; add them here only if the notice asks.","declarationText":"I hereby declare that the information given above is true to the best of my knowledge.","synonyms":[["js","javascript"],["ms excel","excel","microsoft excel"],["powerbi","power bi"],["ml","machine learning"],["ai","artificial intelligence"],["communication","communication skills"],["ms office","microsoft office"],["node.js","nodejs"],["react.js","reactjs","react"],["sql","mysql","postgresql"],["oops","object oriented programming","oop"],["dsa","data structures and algorithms","data structures"],["tally","tally erp","tally prime"],["gst","goods and services tax"],["autocad","auto cad"],["customer service","customer support"],["teamwork","team player"]]};
/* ============================================================
   LOGIC — pure functions, no DOM. Loaded by the app and by tests.js.
   ============================================================ */
const LOGIC = (function () {
  "use strict";

  // ---------- Layouts (India) ----------
  // Each layout: section order, and which India-only extras are switched on by default.
  const LAYOUTS = {
    fresher:     { name: "Fresher (no experience)", order: ["summary", "education", "skills", "projects", "internships", "certifications", "achievements"], govt: false },
    serviceIT:   { name: "Service-company IT",      order: ["summary", "skills", "projects", "education", "certifications", "internships"], govt: false },
    nonIT:       { name: "Non-IT",                  order: ["summary", "education", "skills", "experience", "certifications", "activities"], govt: false },
    govt:        { name: "Government / PSU style",  order: ["summary", "education", "skills", "projects", "internships", "certifications", "achievements", "languages"], govt: true },
    careerBreak: { name: "Career break",            order: ["summary", "skills", "experience", "courses", "education"], govt: false },
  };
  const ALL_SECTIONS = ["summary", "education", "skills", "projects", "internships", "experience", "certifications", "achievements", "activities", "languages", "courses"];
  const SECTION_TITLES = {
    summary: "Summary", education: "Education", skills: "Skills", projects: "Projects",
    internships: "Internships", experience: "Experience", certifications: "Certifications",
    achievements: "Achievements", activities: "Activities", languages: "Languages", courses: "Courses",
  };

  // ---------- Data model ----------
  let idCounter = 0;
  function newId() { idCounter++; return "r" + Date.now().toString(36) + idCounter.toString(36) + Math.random().toString(36).slice(2, 6); }
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function emptyData() {
    return {
      name: "", headline: "", phone: "", email: "", city: "", links: [],
      summary: "",
      education: [], skills: { technical: [], tools: [], soft: [] },
      projects: [], internships: [], experience: [],
      certifications: [], achievements: [], activities: [], languages: [], courses: [],
      dob: "", photo: null, declaration: false,
      show: { dob: false, photo: false, declaration: false },
    };
  }
  function newResume(layout, title) {
    const L = LAYOUTS[layout] || LAYOUTS.fresher;
    const d = emptyData();
    if (L.govt) d.show = { dob: true, photo: true, declaration: true };
    if (L.govt) d.declaration = true;
    return {
      id: newId(), title: title || L.name, layout: LAYOUTS[layout] ? layout : "fresher",
      baseOf: null, jobPost: null, data: d,
      sectionOrder: L.order.slice(), hidden: [], updatedAt: Date.now(),
    };
  }
  function newState() {
    return { version: 1, settings: { lang: "en", paper: "A4", currentId: null }, resumes: [], tailorLog: [], lastBackupAt: null };
  }

  function isResumeEmpty(r) {
    if (!r || !r.data) return true;
    const d = r.data;
    const any = (a) => Array.isArray(a) && a.some((x) => (typeof x === "string" ? x.trim() : x && Object.values(x).some((v) => (Array.isArray(v) ? v.some((s) => String(s).trim()) : String(v || "").trim()))));
    return !(String(d.name || "").trim() || String(d.summary || "").trim() || any(d.education) || any(d.projects) ||
      any(d.experience) || any(d.internships) || d.skills.technical.length || d.skills.tools.length || d.skills.soft.length);
  }

  // ---------- Text helpers ----------
  const clean = (s) => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const nonEmpty = (a) => (a || []).map(clean).filter(Boolean);
  function range(start, end) { const s = clean(start), e = clean(end); return s && e ? s + " – " + e : s || e; }

  function contactParts(d) {
    return [clean(d.phone), clean(d.email), clean(d.city), ...nonEmpty(d.links)].filter(Boolean);
  }
  function eduLines(e) {
    const deg = [clean(e.degree), clean(e.field)].filter(Boolean).join(" in ");
    const where = [clean(e.school), clean(e.city)].filter(Boolean).join(", ");
    const head = [deg, where].filter(Boolean).join(", ");
    const when = range(e.start, e.end);
    const marks = [];
    if (clean(e.cgpa)) marks.push("CGPA: " + clean(e.cgpa) + (clean(e.scale) ? "/" + clean(e.scale) : ""));
    if (clean(e.twelfth)) marks.push("Class 12: " + clean(e.twelfth));
    if (clean(e.tenth)) marks.push("Class 10: " + clean(e.tenth));
    return { head, when, marks: marks.join(" · ") };
  }
  function roleLine(x) {
    const head = [clean(x.role), clean(x.org), clean(x.city)].filter(Boolean).join(", ");
    return { head, when: range(x.start, x.end) };
  }
  function visibleSections(r) {
    return r.sectionOrder.filter((s) => !r.hidden.includes(s));
  }
  function sectionHasContent(r, s) {
    const d = r.data;
    switch (s) {
      case "summary": return !!clean(d.summary);
      case "education": return d.education.some((e) => clean(e.degree) || clean(e.school));
      case "skills": return !!(nonEmpty(d.skills.technical).length || nonEmpty(d.skills.tools).length || nonEmpty(d.skills.soft).length);
      case "projects": return d.projects.some((p) => clean(p.title));
      case "internships": case "experience": return d[s].some((x) => clean(x.role) || clean(x.org));

    }
  }

  // ---------- Resume → plain text (exact reading order of the printed resume) ----------
  function resumeToPlainText(r) {
    const d = r.data, out = [];
    if (clean(d.name)) out.push(clean(d.name));
    const c = contactParts(d); if (c.length) out.push(c.join(" | "));
    if (d.show.dob && clean(d.dob)) out.push("Date of birth: " + clean(d.dob));
    if (clean(d.headline)) out.push(clean(d.headline));
    for (const s of visibleSections(r)) {
      if (!sectionHasContent(r, s)) continue;
      out.push("", SECTION_TITLES[s].toUpperCase());
      if (s === "summary") out.push(clean(d.summary));
      else if (s === "education") d.education.forEach((e) => {
        const l = eduLines(e); if (!l.head && !l.when) return;
        out.push([l.head, l.when].filter(Boolean).join(" | ")); if (l.marks) out.push(l.marks);
      });
      else if (s === "skills") {
        if (nonEmpty(d.skills.technical).length) out.push("Technical: " + nonEmpty(d.skills.technical).join(", "));
        if (nonEmpty(d.skills.tools).length) out.push("Tools: " + nonEmpty(d.skills.tools).join(", "));
        if (nonEmpty(d.skills.soft).length) out.push("Soft skills: " + nonEmpty(d.skills.soft).join(", "));
      } else if (s === "projects") d.projects.forEach((p) => {
        if (!clean(p.title)) return;
        out.push([clean(p.title), clean(p.tech)].filter(Boolean).join(" | "));
        nonEmpty(p.bullets).forEach((b) => out.push("• " + b));
      });
      else if (s === "internships" || s === "experience") d[s].forEach((x) => {
        const l = roleLine(x); if (!l.head) return;
        out.push([l.head, l.when].filter(Boolean).join(" | "));
        nonEmpty(x.bullets).forEach((b) => out.push("• " + b));
      });
      else if (s === "languages") out.push(nonEmpty(d.languages).join(", "));
      else nonEmpty(d[s]).forEach((b) => out.push("• " + b));
    }
    if (d.show.declaration && d.declaration) {
      out.push("", "DECLARATION", clean(DECLARATION_TEXT));
      out.push("Place: " + clean(d.city) + "    Date:    " + clean(d.name));
    }
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  let DECLARATION_TEXT = "I hereby declare that the information given above is true to the best of my knowledge.";
  function setDeclarationText(t) { if (t) DECLARATION_TEXT = t; }

  // ---------- Resume → print HTML (same order as plain text) ----------
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  function resumeToHTML(r) {
    const d = r.data, h = [];
    h.push('<header class="rv-head">');
    if (d.show.photo && d.photo) h.push('<img class="rv-photo" src="' + esc(d.photo) + '" alt="">');
    h.push('<h1 class="rv-name">' + esc(clean(d.name) || "Your Name") + "</h1>");
    const c = contactParts(d); if (c.length) h.push('<p class="rv-contact">' + c.map(esc).join(" | ") + "</p>");
    if (d.show.dob && clean(d.dob)) h.push('<p class="rv-contact">Date of birth: ' + esc(clean(d.dob)) + "</p>");
    if (clean(d.headline)) h.push('<p class="rv-headline">' + esc(clean(d.headline)) + "</p>");
    h.push("</header>");
    const row = (head, when) => '<p class="rv-row"><span class="rv-strong">' + esc(head) + "</span>" + (when ? ' | <span class="rv-when">' + esc(when) + "</span>" : "") + "</p>";
    const bullets = (list) => { const b = nonEmpty(list); return b.length ? '<ul class="rv-ul">' + b.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : ""; };
    for (const s of visibleSections(r)) {
      if (!sectionHasContent(r, s)) continue;
      h.push('<section class="rv-sec"><h2 class="rv-h2">' + esc(SECTION_TITLES[s]) + "</h2>");
      if (s === "summary") h.push('<p class="rv-p">' + esc(clean(d.summary)) + "</p>");
      else if (s === "education") d.education.forEach((e) => {
        const l = eduLines(e); if (!l.head && !l.when) return;
        h.push(row(l.head, l.when)); if (l.marks) h.push('<p class="rv-p">' + esc(l.marks) + "</p>");
      });
      else if (s === "skills") {
        const line = (k, v) => (nonEmpty(v).length ? '<p class="rv-p"><span class="rv-strong">' + k + ":</span> " + esc(nonEmpty(v).join(", ")) + "</p>" : "");
        h.push(line("Technical", d.skills.technical) + line("Tools", d.skills.tools) + line("Soft skills", d.skills.soft));
      } else if (s === "projects") d.projects.forEach((p) => {
        if (!clean(p.title)) return;
        h.push(row(clean(p.title), clean(p.tech)) + bullets(p.bullets));
      });
      else if (s === "internships" || s === "experience") d[s].forEach((x) => {
        const l = roleLine(x); if (!l.head) return;
        h.push(row(l.head, l.when) + bullets(x.bullets));
      });
      else if (s === "languages") h.push('<p class="rv-p">' + esc(nonEmpty(d.languages).join(", ")) + "</p>");
      else h.push(bullets(d[s]));
      h.push("</section>");
    }
    if (d.show.declaration && d.declaration) {
      h.push('<section class="rv-sec"><h2 class="rv-h2">Declaration</h2><p class="rv-p">' + esc(clean(DECLARATION_TEXT)) + "</p>" +
        '<p class="rv-p">Place: ' + esc(clean(d.city)) + " &nbsp;&nbsp; Date: &nbsp;&nbsp; " + esc(clean(d.name)) + "</p></section>");
    }
    return h.join("");
  }

  // ---------- Keyword matching ----------
  const STOP = new Set(("a about above after again against all also am an and any are as at be because been before being below between both but by can could did do does doing down during each few for from further had has have having he her here hers herself him himself his how i if in into is it its itself just me more most my myself no nor not now of off on once only or other our ours ourselves out over own same she should so some such than that the their theirs them themselves then there these they this those through to too under until up very was we were what when where which while who whom why will with would you your yours yourself yourselves etc via per e.g i.e" +
    " candidate candidates role roles ability able years year experience experienced responsibilities responsibility job jobs work working team company looking seeking required requirement requirements preferred plus strong good excellent knowledge understanding skills skill must should may including include includes include like new opportunity apply position qualification qualifications degree minimum well using use based related relevant other various within across ensure join us we're you'll you're will help across day days time full part benefits salary location offer offers about us who what's what" +
    // common job-post verbs and filler, so "uses Kotlin" becomes "Kotlin"
    " use uses used build builds built develop develops developing create creates creating manage manages handle handles love loves enjoy want need needs needed get make makes provide provides support supports deliver delivers maintain maintains drive drives assist assists perform performs" +
    " proficient proficiency familiar familiarity exposure hands-on hands solid basic sound proven demonstrated ideal ideally great passion passionate eager motivated self-motivated fast-paced dynamic" +
    " startup startups company's apps app product products clients client customers customer's environment environments opportunities growth career" +
    " hiring hire understand prepare prepares office offices discipline disciplines stream streams bachelor bachelor's bachelors graduate graduates graduation any weekly monthly daily needs junior senior fresher freshers trainee").split(/\s+/));
  const REQ_HEAD = /^\s*(requirements?|skills?( required)?|qualifications?|must[- ]haves?|must have|you have|what you('ll| will) need|what we('re| are) looking for|eligibility|desired skills|key skills|technical skills|preferred skills)\b/i;
  const OTHER_HEAD = /^\s*(about( us| the (company|role))?|responsibilities|what you('ll| will) do|benefits|perks|why join|our (company|team)|job description|role overview|location|salary|how to apply)\b/i;

  function normalize(text) {
    return String(text || "").toLowerCase()
      .replace(/[^a-z0-9+#./\-\s]/g, " ")
      .split(/\s+/).map((t) => t.replace(/^[./\-]+|[./\-]+$/g, "")).filter(Boolean).join(" ");
  }
  function stem(t) {
    if (/[+#./]/.test(t) || t.length <= 3) return t;
    if (t.endsWith("ies") && t.length > 4) return t.slice(0, -3) + "y";
    if (t.endsWith("ing") && t.length > 5) return t.slice(0, -3);
    if (t.endsWith("es") && /(ches|shes|xes|sses)$/.test(t)) return t.slice(0, -2);
    if (t.endsWith("s") && !t.endsWith("ss")) return t.slice(0, -1);
    return t;
  }
  const stemSeq = (s) => normalize(s).split(" ").filter(Boolean).map(stem);

  function extractTerms(jobPost, limit = 25) {
    const lines = String(jobPost || "").split(/\r?\n/);
    const counts = new Map();   // key -> { w, display, n }
    let reqMode = false;
    for (const raw of lines) {
      const line = raw.trim(); if (!line) continue;
      if (REQ_HEAD.test(line)) reqMode = true;
      else if (OTHER_HEAD.test(line)) reqMode = false;
      const bonus = reqMode ? 2 : 0;
      // split into phrases at punctuation and the words "and"/"or"
      const phrases = line.replace(/^[\-*•·▪●\d.)\s]+/, "").split(/[,;:|•·()\[\]{}!?]|\s(?:and|or|&|\/\/)\s|\.\s|\.$/i);
      for (const ph of phrases) {
        const origWords = ph.trim().split(/\s+/).filter(Boolean);
        const norm = origWords.map((w) => normalize(w));
        // runs of non-stop words
        let run = [];
        const flush = () => {
          for (let n = 1; n <= 3; n++) {
            for (let i = 0; i + n <= run.length; i++) {
              const seg = run.slice(i, i + n);
              const key = seg.map((x) => stem(x.n)).join(" ");
              if (!key || /^\d+$/.test(key.replace(/\s/g, ""))) continue;
              const e = counts.get(key) || { w: 0, n, display: seg.map((x) => x.o).join(" "), c: 0 };
              e.w += 1 + bonus; e.c += 1; counts.set(key, e);
            }
          }
          run = [];
        };
        norm.forEach((n, i) => {
          if (!n || STOP.has(n) || n.length < 2 && !/[+#]/.test(n)) { flush(); return; }
          run.push({ n, o: origWords[i].replace(/^[^\w+#.]+|[^\w+#]+$/g, "") });
        });
        flush();
      }
    }
    // drop a shorter phrase when a longer phrase containing it has the same count
    const keys = [...counts.keys()];
    const out = [];
    for (const k of keys) {
      const e = counts.get(k);
      const covered = keys.some((k2) => k2 !== k && counts.get(k2).n > e.n && counts.get(k2).c >= e.c && (" " + k2 + " ").includes(" " + k + " "));
      if (!covered) out.push({ key: k, term: e.display, weight: e.w, n: e.n });
    }
    out.sort((a, b) => b.weight - a.weight || b.n - a.n || a.term.localeCompare(b.term));
    return out.slice(0, limit);
  }

  let SYNONYMS = [];
  function setSynonyms(groups) { SYNONYMS = (groups || []).map((g) => g.map((x) => stemSeq(x).join(" "))); }
  function variantsOf(key) {
    const v = new Set([key]);
    for (const g of SYNONYMS) if (g.includes(key)) g.forEach((x) => v.add(x));
    return [...v];
  }
  function matchTerms(terms, resumeText) {
    const hay = " " + stemSeq(resumeText).join(" ") + " ";
    const found = [], missing = [];
    for (const t of terms) {
      const key = t.key || stemSeq(t.term || t).join(" ");
      const label = t.term || t;
      const hit = variantsOf(key).some((v) => v && hay.includes(" " + v + " "));
      (hit ? found : missing).push(label);
    }
    return { found, missing };
  }

  // ---------- CRC-32 + store-only ZIP ----------
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  // ---------- Word (.docx) ----------
  const xesc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  function buildDocx(r, paper) {
    const d = r.data, P = [];
    const run = (t, o = {}) => "<w:r>" + (o.b || o.i ? "<w:rPr>" + (o.b ? "<w:b/>" : "") + (o.i ? "<w:i/>" : "") + "</w:rPr>" : "") + '<w:t xml:space="preserve">' + xesc(t) + "</w:t></w:r>";
    const para = (runs, style, o = {}) => "<w:p>" + (style || o.center ? "<w:pPr>" + (style ? '<w:pStyle w:val="' + style + '"/>' : "") + (o.center ? '<w:jc w:val="center"/>' : "") + "</w:pPr>" : "") + runs + "</w:p>";
    const bullet = (t) => '<w:p><w:pPr><w:pStyle w:val="ListBullet"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr></w:pPr>' + run(t) + "</w:p>";
    const row = (head, when) => para(run(head, { b: true }) + (when ? run(" | " + when) : ""));
    P.push(para(run(clean(d.name) || "Your Name"), "Heading1", { center: true }));
    const c = contactParts(d); if (c.length) P.push(para(run(c.join(" | ")), null, { center: true }));
    if (d.show.dob && clean(d.dob)) P.push(para(run("Date of birth: " + clean(d.dob)), null, { center: true }));
    if (clean(d.headline)) P.push(para(run(clean(d.headline), { i: true }), null, { center: true }));
    for (const s of visibleSections(r)) {
      if (!sectionHasContent(r, s)) continue;

      if (s === "summary") P.push(para(run(clean(d.summary))));
      else if (s === "education") d.education.forEach((e) => { const l = eduLines(e); if (!l.head && !l.when) return; P.push(row(l.head, l.when)); if (l.marks) P.push(para(run(l.marks))); });
      else if (s === "skills") [["Technical", d.skills.technical], ["Tools", d.skills.tools], ["Soft skills", d.skills.soft]].forEach(([k, v]) => { if (nonEmpty(v).length) P.push(para(run(k + ": ", { b: true }) + run(nonEmpty(v).join(", ")))); });
      else if (s === "projects") d.projects.forEach((p) => { if (!clean(p.title)) return; P.push(row(clean(p.title), clean(p.tech))); nonEmpty(p.bullets).forEach((b) => P.push(bullet(b))); });
      else if (s === "internships" || s === "experience") d[s].forEach((x) => { const l = roleLine(x); if (!l.head) return; P.push(row(l.head, l.when)); nonEmpty(x.bullets).forEach((b) => P.push(bullet(b))); });

    if (d.show.declaration && d.declaration) {

    }
    const letter = paper === "LETTER";
    const sect = '<w:sectPr><w:pgSz w:w="' + (letter ? 12240 : 11906) + '" w:h="' + (letter ? 15840 : 16838) + '"/><w:pgMar w:top="794" w:right="850" w:bottom="794" w:left="850" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>';

      { name: "_rels/.rels", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>' },
      { name: "word/_rels/document.xml.rels", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>' },
      { name: "word/document.xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ' + W + "><w:body>" + P.join("") + sect + "</w:body></w:document>" },
      { name: "word/styles.xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ' + W + '><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-IN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="40" w:line="252" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
        '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
        '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:after="40"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr></w:style>' +

  function sectionCard(r, s, i) {

  function runTailor() {

  // ---------- photo ----------
  function readPhoto(file) {
    const r = cur(); if (!r || !file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const w = Math.min(300, img.width), h = Math.round(img.height * w / img.width);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      r.data.photo = c.toDataURL("image/jpeg", 0.85); URL.revokeObjectURL(url); touch(r); save(true); render();
      if (JSON.stringify(state).length > 4e6) toast("Storage is nearly full. Use a smaller photo or delete old resumes.");
    };
    img.onerror = () => toast("Couldn't read that image.");
    img.src = url;
  }

      case "go": go(b.dataset.tab); break;
      case "new": layoutPicker(); break;
      case "pick-layout": closeSheet(); if (addResume(L.newResume(b.dataset.layout))) { ui.open = { personal: true }; go("build"); } break;
      case "sample": { const s = L.sampleResume(); if (addResume(s)) { toast("Sample resume added"); go("build"); } break; }
      case "open": setCurrent(b.dataset.id); go("build"); break;
      case "dup": { const x = find(b.dataset.id); const c = L.clone(x); c.id = L.newId(); c.title = x.title + " (copy)"; c.updatedAt = Date.now(); if (addResume(c)) { toast("Copy made"); render(); } break; }
      case "rename": { const x = find(b.dataset.id); promptDialog("Rename resume", "Name", x.title, (v) => { x.title = v; touch(x); render(); }); break; }
      case "del": { const x = find(b.dataset.id); confirmDialog("Delete this resume?", "\"" + x.title + "\" will be deleted from this device.", "Delete", () => {
        state.resumes = state.resumes.filter((y) => y.id !== x.id); if (state.settings.currentId === x.id) state.settings.currentId = state.resumes[0] ? state.resumes[0].id : null; save(true); render(); toast("Resume deleted"); }, true); break; }
      case "toggle-card": ui.open[b.dataset.id] = b.getAttribute("aria-expanded") !== "true"; render(); break;
      case "sec-up": case "sec-down": { const o = r.sectionOrder, i = o.indexOf(b.dataset.sec), j = act === "sec-up" ? i - 1 : i + 1; if (j < 0 || j >= o.length) break; [o[i], o[j]] = [o[j], o[i]]; touch(r); render(); break; }
      case "add-section": { const s = $("#addSec").value; r.sectionOrder.push(s); ui.open[s] = true; touch(r); render(); break; }
      case "add-entry": { const l = b.dataset.list; r.data[l].push(NEW_ENTRY[l]()); touch(r); render(); break; }
      case "entry-del": { const l = b.dataset.list, k = +b.dataset.k; confirmDialog("Delete this entry?", "It will be removed from this resume.", "Delete", () => { r.data[l].splice(k, 1); touch(r); render(); }, true); break; }
      case "entry-up": { const a = r.data[b.dataset.list], k = +b.dataset.k; if (k > 0) { [a[k - 1], a[k]] = [a[k], a[k - 1]]; touch(r); render(); } break; }
      case "bul-add": r.data[b.dataset.list][+b.dataset.k].bullets.push(""); touch(r); render(); break;
      case "bul-del": r.data[b.dataset.list][+b.dataset.k].bullets.splice(+b.dataset.j, 1); touch(r); render(); break;
      case "bul-up": { const a = r.data[b.dataset.list][+b.dataset.k].bullets, j = +b.dataset.j; if (j > 0) { [a[j - 1], a[j]] = [a[j], a[j - 1]]; touch(r); render(); } break; }
      case "examples": { const key = b.dataset.key + "|" + b.dataset.target; ui.examples[key] = !ui.examples[key]; render(); break; }
      case "use-example": {
        const t = b.dataset.target, text = b.dataset.text;
        if (t.startsWith("bullet:")) { const [l, k] = t.slice(7).split("."); const bl = r.data[l][+k].bullets; const empty = bl.findIndex((x) => !x.trim()); if (empty >= 0) bl[empty] = text; else bl.push(text); }
        else if (t.startsWith("lines:")) { const a = getAt(r, t.slice(6)); const empty = a.findIndex((x) => !x.trim()); if (empty >= 0) a[empty] = text; else a.push(text); }
        else setAt(r, t, text);
        touch(r); render(); toast("Added. Now change it to your own words."); break;
      }
      case "photo-del": r.data.photo = null; touch(r); render(); break;
      case "preview": preview(); break;
      case "paste": try { $("#tText").value = await navigator.clipboard.readText(); } catch (err) { toast("Long-press the box and choose Paste."); } break;
      case "tailor-run": runTailor(); break;
      case "chip": chipMenu(b.dataset.word); break;
      case "tailor-save": {
        const T = ui.tailor, base = state.resumes.find((x) => x.id === T.resumeId); if (!base) break;
        const c = L.duplicateForJob(base, { text: T.text, company: T.company, role: T.role });
        if (!addResume(c)) break;
        state.tailorLog.push({ resumeId: c.id, resumeTitle: c.title, company: T.company.trim(), role: T.role.trim(), date: new Date().toISOString().slice(0, 10), missingCount: T.result.missing.length });
        save(true); toast("Tailored copy saved: " + c.title); ui.tailor.result = null; go("build"); break;
      }
      case "copy-plain": copyText(L.resumeToPlainText(r), "Resume text copied"); break;
      case "copy-fname": copyText(L.suggestedFileName(r), "File name copied"); break;
      case "guide": ui.guide = b.dataset.g; render(); break;
      case "pdf": printPDF(); break;
      case "docx": download(L.suggestedFileName(r).replace(/\.pdf$/, ".docx"), new Blob([L.buildDocx(r, CONFIG.paper)], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })); toast("Word file downloaded"); break;
      case "backup-menu": backupMenu(); break;
      case "backup": doBackup(); break;
      case "csv": download("ResumeKit_jobs_tailored.csv", L.toCSV(state.tailorLog), "text/csv;charset=utf-8"); toast("CSV downloaded"); break;
      case "reset": resetDialog(); break;
      case "howto": howTo(); break;
    }
  });
  function chipMenu(word) {
    const r = state.resumes.find((x) => x.id === ui.tailor.resumeId); if (!r) return;
    const o = sheet('"' + word + '"', '<p class="small">Add this only if it\'s true for you. It\'s added to the Technical skills of "' + esc(r.title) + '".</p><div class="row"><button class="btn primary grow" id="chipAdd">Add to Skills</button><button class="btn grow" id="chipCopy">Copy</button></div>');
    $("#chipAdd", o).onclick = () => {
      if (!r.data.skills.technical.some((s) => s.toLowerCase() === word.toLowerCase())) r.data.skills.technical.push(word);
      touch(r); closeSheet();
      const T = ui.tailor; T.result = Object.assign(L.matchTerms(L.extractTerms(T.text), L.resumeToPlainText(r)), { none: false });
      render(); toast("Added to Skills");
    };
    $("#chipCopy", o).onclick = () => { copyText(word); closeSheet(); };
  }
  document.addEventListener("input", (e) => {
    const t = e.target, r = cur(); if (!r) return;
    if (t.dataset.path) { setAt(r, t.dataset.path, t.value); touch(r); if (t.dataset.path === "data.name") $("#curName").textContent = r.title; }
    else if (t.dataset.list) { setAt(r, t.dataset.list, t.value.split(",").map((s) => s.trim()).filter(Boolean)); touch(r); }
    else if (t.dataset.lines) { setAt(r, t.dataset.lines, t.value.split("\n")); touch(r); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target, r = cur();
    if (t.id === "tRes") { ui.tailor.result = null; setCurrent(t.value); render(); return; }
    if (t.dataset.act === "restore") {
      const f = t.files[0]; if (!f) return;
      if (f.size > 20e6) { toast("That file is too big. Nothing was changed."); return; }
      f.text().then((txt) => {
        const res = L.validateImport(txt);
        if (!res.ok) { toast(res.error); return; }
        confirmDialog("Replace your data?", "This replaces the " + state.resumes.length + " resume(s) here with the " + res.state.resumes.length + " in the backup.", "Restore", () => { state = res.state; save(true); ui.tab = "resumes"; render(); toast("Backup restored"); });
      });
      return;
    }
    if (!r) return;
    if (t.dataset.act === "photo") { readPhoto(t.files[0]); return; }
    if (t.dataset.switch) { r.data.show[t.dataset.switch.split(".")[1]] = t.checked; if (t.dataset.switch === "show.declaration") r.data.declaration = t.checked; touch(r); render(); return; }
    if (t.dataset.act === "sec-show") { const s = t.dataset.sec; r.hidden = t.checked ? r.hidden.filter((x) => x !== s) : r.hidden.concat(s); touch(r); render(); return; }
    if (t.tagName === "SELECT" && t.dataset.path) { setAt(r, t.dataset.path, t.value); touch(r); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  window.addEventListener("beforeunload", () => save(true));

  // ---------- start ----------
  shell();
  if (!cur() && state.resumes.length) state.settings.currentId = state.resumes[0].id;
  render();
  window.__RK = { get state() { return state; }, go, L };   // for testing
})();

</script>
</body>
</html>
