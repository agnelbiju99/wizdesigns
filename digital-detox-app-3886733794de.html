<style>:root {
--bg: #0F1420; --card: #171D2B; --card2: #131826; --border: #263047; --border2: #314061;
--text: #EEF1F7; --text2: #9AA3B5; --mint: #7FD8BE; --mint-text: #7FD8BE; --on-mint: #0F1420;
--coral: #F29B8B; --coral-text: #F29B8B; --on-coral: #0F1420;
--mint-tint: rgba(127, 216, 190, .10); --mint-tint2: rgba(127, 216, 190, .18); --coral-tint: rgba(242, 155, 139, .12);
--flex: #E0B868; --flex-edge: #E0B868; --gold-text: #E0B868; --gold-tint: rgba(224, 184, 104, .16); --none: #2A3348;
--shadow: 0 1px 0 rgba(255, 255, 255, .02), 0 10px 28px rgba(0, 0, 0, .28);
--serif: 'Sora', 'Anek Malayalam', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
--sans: 'Plus Jakarta Sans', 'Anek Malayalam', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
--radius: 18px; --tab-h: 66px;
color-scheme: dark;
}
[data-theme="light"] {
--bg: #F7F8FB; --card: #FFFFFF; --card2: #F0F2F7; --border: #DDE2EC; --border2: #C9D0DE;
--text: #161B26; --text2: #5A6375; --mint-text: #1B7D63; --coral-text: #B5483A;
--mint-tint: rgba(31, 138, 110, .08); --mint-tint2: rgba(31, 138, 110, .14); --coral-tint: rgba(242, 155, 139, .16);
--flex: #E0B868; --flex-edge: #A8812E; --gold-text: #7E5B12; --gold-tint: rgba(224, 184, 104, .22); --none: #E3E7EF;
--shadow: 0 1px 2px rgba(20, 30, 60, .05), 0 8px 24px rgba(20, 30, 60, .06);
color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body.lang-ml { line-height: 1.65; }
body.lang-ml .top h1, body.lang-ml .fr-title, body.lang-ml .hero h1, body.lang-ml .slump h2, body.lang-ml .sheet-head h2, body.lang-ml .swap-big .swap-text { letter-spacing: 0; }
a { color: var(--mint-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; vertical-align: middle; }
.ic.big { width: 34px; height: 34px; color: var(--mint-text); display: block; margin: 0 0 8px; }
.muted { color: var(--text2); }
.hint { color: var(--text2); font-size: 13px; margin: 6px 0 0; }
.error { color: var(--coral-text); font-size: 13.5px; font-weight: 600; margin-top: 8px; }
.opt { font-weight: 400; color: var(--text2); text-transform: none; letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.wz-header { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.wz-header .in { display: flex; align-items: center; gap: 10px; padding: 10px 16px; max-width: 1240px; margin: 0 auto; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--mint); color: var(--on-mint); display: grid; place-items: center; flex: none; }
.logo .ic { width: 24px; height: 24px; }
.brand { flex: 1; min-width: 0; }
.brand .n { font: 600 17px/1.2 var(--serif); letter-spacing: -.3px; }
.brand .n b { font-weight: 600; color: var(--mint-text); white-space: nowrap; }
.brand .by { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text2); margin-top: 2px; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.hdr-date { display: none; color: var(--text2); font-size: 13px; }
.theme-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--mint-text); display: grid; place-items: center; cursor: pointer; }
.seg-mini { display: flex; height: 44px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.seg-mini button { min-width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--text2); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0 10px; }
