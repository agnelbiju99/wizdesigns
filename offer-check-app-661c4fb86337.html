[data-theme="dark"]{
  --bg:#0F1A0F; --surface:#162016; --surface2:#1A261A;
  --accent:#2DBD6E; --accent2:#3DD880; --accent-light:#1A3A25; --accent-ultra:#122018;
  --violet:#9B7EE0; --violet-light:#1E1535;
  --amber:#F5A524; --amber-light:#2A2008;
  --coral:#F4645F; --coral-light:#2A1210;
  --sky:#6CB8FF; --sky-light:#12233A;
  --text:#E8F5E8; --text2:#A8CCA8; --muted:#6F9A6F; --border:#1E3A1E;
  --shadow:0 2px 16px rgba(0,0,0,.35); --shadow-md:0 6px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background .25s,color .25s}
.wz-serif{font-family:var(--serif);letter-spacing:-.2px}
.wz-wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}

/* ---------- header ---------- */
.wz-header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.wz-header .in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wz-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 6px 16px rgba(45,189,110,.35);flex-shrink:0}
.wz-brand .n{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.1}
.wz-brand .n b{color:var(--accent)}
.wz-brand .by{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.wz-header .tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wz-date{font-size:13px;color:var(--text2);font-weight:500}

/* ---------- tabs ---------- */
.wz-tabs{background:var(--surface2);border-bottom:1px solid var(--border)}
.wz-tabs .in{max-width:1080px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.wz-tabs .in::-webkit-scrollbar{display:none}
.wz-tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 10px;font:600 14px var(--sans);color:var(--text2);cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s}
.wz-tabs button:hover{color:var(--accent2)}
.wz-tabs button.on{color:var(--accent2);border-bottom-color:var(--accent)}
@media(min-width:721px){.wz-tabs .in{flex-wrap:wrap}}
@media(max-width:720px){.wz-tabs .in{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:28px}}

/* ---------- page title, cards, labels ---------- */
.wz-title{font-family:var(--serif);font-weight:700;font-size:30px;margin:26px 0 4px;display:flex;align-items:center;gap:10px;letter-spacing:-.4px}
.wz-sub{color:var(--text2);margin:0 0 18px;font-size:14.5px}
.wz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-top:16px}
.wz-label{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--text2);margin:0 0 10px}
.wz-hint{font-size:13.5px;color:var(--muted);margin:-4px 0 14px}
.wz-grid{display:grid;gap:16px}
.wz-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.wz-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.wz-g4{grid-template-columns:repeat(2,minmax(0,1fr))}.wz-g2{grid-template-columns:1fr}}

/* ---------- stat cards ---------- */
.wz-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.wz-stat .k{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.wz-stat .v{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;margin-top:8px;letter-spacing:-.5px;color:var(--text)}
.wz-stat .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.c-accent{color:var(--accent2)!important} .c-coral{color:var(--coral)!important} .c-amber{color:var(--amber)!important} .c-violet{color:var(--violet)!important} .c-sky{color:var(--sky)!important}

/* ---------- buttons, inputs, pills ---------- */
.wz-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:700 14px var(--sans);cursor:pointer;box-shadow:0 4px 14px rgba(45,189,110,.28);transition:transform .15s,box-shadow .2s,background .2s}
.wz-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.wz-btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:none}
.wz-btn.ghost:hover{border-color:var(--accent);color:var(--accent2);background:var(--surface)}
.wz-btn.amber{background:var(--amber-light);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);box-shadow:none}
.wz-btn.danger{background:var(--surface);color:var(--coral);border:1px solid color-mix(in srgb,var(--coral) 40%,transparent);box-shadow:none}
.wz-btn.sm{padding:7px 13px;font-size:13px}
.wz-input,.wz-card input:not([type=checkbox]),.wz-card select,.wz-card textarea,.wz-sheet input:not([type=checkbox]),.wz-sheet select{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:11px 13px;font:15px var(--sans);margin-top:6px;transition:border-color .2s,box-shadow .2s}
.wz-card input:focus,.wz-card select:focus,.wz-sheet input:focus,.wz-sheet select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-ultra)}
.wz-field-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.wz-seg{display:inline-flex;background:var(--accent-ultra);border:1px solid var(--border);border-radius:999px;padding:3px}
.wz-seg button{background:none;border:0;border-radius:999px;padding:6px 12px;font:700 12.5px var(--sans);color:var(--text2);cursor:pointer}
.wz-seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(45,189,110,.3)}
.wz-switch{width:46px;height:26px;border-radius:999px;background:var(--accent-light);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0}
.wz-switch::after{content:"☀️";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
[data-theme="dark"] .wz-switch::after{content:"🌙";left:22px}

/* ---------- tags, empty states, alerts, progress ---------- */
.wz-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-light);color:var(--accent2)}
.wz-tag.violet{background:var(--violet-light);color:var(--violet)} .wz-tag.amber{background:var(--amber-light);color:var(--amber)} .wz-tag.coral{background:var(--coral-light);color:var(--coral)} .wz-tag.sky{background:var(--sky-light);color:var(--sky)}
.wz-empty{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-ultra);border-radius:14px;padding:18px;text-align:center;color:var(--text2);font-size:14px}
.wz-alert{border-radius:14px;padding:13px 16px;font-size:14px;border:1px solid}
.wz-alert.coral{background:var(--coral-light);border-color:color-mix(in srgb,var(--coral) 35%,transparent);color:var(--text)}
.wz-alert.amber{background:var(--amber-light);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.wz-alert.accent{background:var(--accent-ultra);border-color:var(--border)}
.wz-bar{height:9px;background:var(--accent-ultra);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.wz-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.wz-bar.amber>i{background:linear-gradient(90deg,#F7B733,var(--amber))} .wz-bar.coral>i{background:linear-gradient(90deg,#FF8A80,var(--coral))}
.wz-quote{background:linear-gradient(120deg,var(--accent-ultra),var(--violet-light));border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.wz-quote::before{content:"\201C";position:absolute;top:-18px;left:10px;font:700 90px/1 var(--serif);color:color-mix(in srgb,var(--accent) 35%,transparent)}
.wz-quote p:not(.wz-label){font:italic 600 18px/1.45 var(--serif);margin:10px 0 0;position:relative}

/* ---------- sheet (modal), toast, badge ---------- */
.wz-modal{position:fixed;inset:0;background:rgba(10,25,15,.45);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.wz-modal.on{display:flex;animation:wzFade .2s}
.wz-sheet{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:22px 20px 24px;box-shadow:var(--shadow-md);animation:wzUp .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.wz-modal{align-items:center}.wz-sheet{border-radius:24px}}
.wz-sheet h3{font:700 22px var(--serif);margin:0 0 14px}
.wz-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:70;pointer-events:none;font-size:14px;box-shadow:var(--shadow-md)}
.wz-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.wz-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FFE58A,#F5B83D);color:#5A3A00;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(245,184,61,.4)}
@keyframes wzFade{from{opacity:0}to{opacity:1}}
@keyframes wzUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes wzPop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.wz-pop{animation:wzPop .35s cubic-bezier(.2,.8,.2,1)}

/* ---------- charts ---------- */
.wz-legend{display:grid;gap:8px;font-size:13.5px}
.wz-legend .li{display:flex;align-items:center;gap:8px}
.wz-legend .sw{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.wz-legend .li b{margin-left:auto;font-weight:700}
.wz-chart-text{font-family:var(--sans);fill:var(--muted);font-size:11px}
.wz-chart-big{font-family:var(--serif);font-weight:700;fill:var(--text)}

@media print{.wz-header,.wz-tabs,.wz-btn,.wz-modal,.wz-toast{display:none!important}body{background:#fff}}

</style>

  <!-- 4. DECISION SHEET -->
  <section class="scr" id="sheet">
    <div class="no-print">

        <button type="button" class="wz-btn" id="bPrint" data-i18n="b_print"></button>

<script id="engine">
/* =====================================================================
   Offer Check — calculation engine (pure functions, no DOM).
   Every tax and payroll number lives in CONFIG. Nothing else in this
   file (or the UI) hard-codes a rate, slab or limit.
   ===================================================================== */

// Verified on 26 Nov 2026 from: Union Budget 2026-27 (no change to slabs, rebate or standard deduction),
// incometaxindia.gov.in tax-rate tables (surcharge), Income-tax Act 2025 in force from 1 Apr 2026,
// Income-tax Rules 2026 (50% HRA cities), EPFO wage ceiling S.O. 5109(E) of 17 Sep 2026 (₹25,000),
// Labour Codes in force from 21 Nov 2025 (wages ≥ 50% of pay), state professional-tax schedules.
// Income-tax Act 2025 section numbers checked 26 Nov 2026 (Business Today, ClearTax, TaxGuru mapping tables):
// 80C → 123, 80D → 126, 87A → 156, standard deduction 16(ia) → 19. HRA 10(13A) and professional tax 16(iii):
// sources disagree on the new number, so the app shows only the plain name for those two.
// Kerala professional tax: ₹1,250 per half-year at half-yearly income ₹1,25,000+ = ₹2,500/yr (all ₹6–15 LPA salaries).
const CONFIG = {
  verifiedOn: "2026-11-26",   // shown in the app as the "verified on" date
  fy: "FY 2026-27",
  monthsPerYear: 12,
  cess: 0.04,
  newRegime: {
    stdDeduction: 75000,
    // [upper limit of the slab, rate]
    slabs: [[400000, 0], [800000, 0.05], [1200000, 0.10], [1600000, 0.15], [2000000, 0.20], [2400000, 0.25], [Infinity, 0.30]],
    rebateLimit: 1200000,        // tax is zero if taxable income is at or below this
    rebateMarginalRelief: true,  // just above the limit, tax can't exceed (taxable − limit)
    // [income above which the rate applies, surcharge rate]; capped at 25% in the new regime
    surcharge: [[5000000, 0.10], [10000000, 0.15], [20000000, 0.25]],
  },
  oldRegime: {
    stdDeduction: 50000,
    slabs: [[250000, 0], [500000, 0.05], [1000000, 0.20], [Infinity, 0.30]],
    rebateLimit: 500000,
    rebateMarginalRelief: false,
    surcharge: [[5000000, 0.10], [10000000, 0.15], [20000000, 0.25], [50000000, 0.37]],
    sec80CLimit: 150000,
    // Sec 126 (old 80D): health insurance. Self/family ₹25,000; parents ₹25,000, or ₹50,000 if a parent is 60+.
    s80D: { self: 25000, parents: 25000, parentsSenior: 50000 },
    hraRentFloorPctOfBasic: 0.10,  // rent paid minus 10% of basic
    hraCapMetro: 0.50,             // 50% of basic in the 8 listed cities
    hraCapOther: 0.40,
  },
  pf: { rate: 0.12, wageCeilingMonthly: 25000 },  // 12% each side; ceiling ₹25,000/month from 17 Sep 2026
  gratuityRate: 0.0481,                            // 15/26 of one month's basic per year ≈ 4.81%
  basicPct: { def: 50, min: 30, max: 70 },         // Labour Codes: wages at least 50% of pay
  labourCodeMinBasicPct: 50,                       // wages must be at least this % of pay (Labour Codes)
  labourCode: { maxRounds: 20, tolerance: 1 },     // PF and gratuity depend on wages: solve by iteration (₹1 tolerance)
  variableLikelyPct: { def: 80, min: 0, max: 100 },// "Likely" case: expected share of variable pay that is paid
  tieThresholdMonthly: 100,                        // offers closer than this (₹/month left) are a tie
  bonusHighTaxNotePct: 30,                         // explain when a joining bonus loses more than this % to tax (display only)
  // Income-tax Act 2025 section labels: n = new number, o = old (1961 Act) number.
  // n: null means the new number could not be confirmed, so the app shows the plain name instead.
  sections: {
    s80c: { n: "123", o: "80C" },
    s80d: { n: "126", o: "80D" },
    s87a: { n: "156", o: "87A" },
    ssd:  { n: "19",  o: "16" },
    shra: { n: null,  o: "10(13A)" },
    spt:  { n: null,  o: "16" },
  },
  hraPctOfBasic: { metro: 50, other: 40 },
  noticeDaysPerMonth: 30,
  // Cities with the 50% HRA limit under Income-tax Rules 2026 (old regime only)
  metroCities: ["mumbai", "delhi", "kolkata", "chennai", "bengaluru", "hyderabad", "pune", "ahmedabad"],
  otherCities: ["kochi", "thiruvananthapuram", "kozhikode", "thrissur", "coimbatore", "noida", "gurugram", "jaipur", "indore", "other"],
  // Professional tax: yearly amount at the top slab, the monthly gross from which that top slab applies,
  // and whether sources disagreed (shown as "approx." in the app). Lower salaries pay less.
  pt: {
    kerala:        { yearly: 2500, fromMonthly: 20834, approx: false },
    karnataka:     { yearly: 2500, fromMonthly: 25000, approx: true },
    tamilnadu:     { yearly: 2500, fromMonthly: 12500, approx: true },
    maharashtra:   { yearly: 2500, fromMonthly: 10001, approx: false },
    telangana:     { yearly: 2400, fromMonthly: 20001, approx: false },
    andhra:        { yearly: 2400, fromMonthly: 20001, approx: false },
    westbengal:    { yearly: 2400, fromMonthly: 40001, approx: false },
    gujarat:       { yearly: 2400, fromMonthly: 12000, approx: false },
    madhyapradesh: { yearly: 2500, fromMonthly: 37501, approx: true },
    nopt:          { yearly: 0, fromMonthly: 0, approx: false },   // Delhi, UP, Haryana, Rajasthan… have no professional tax
  },
  // Professional-tax state for each city. "other" has none: the user picks the state (no silent default).
  cityState: { mumbai: "maharashtra", delhi: "nopt", kolkata: "westbengal", chennai: "tamilnadu", bengaluru: "karnataka", hyderabad: "telangana",
    pune: "maharashtra", ahmedabad: "gujarat", kochi: "kerala", thiruvananthapuram: "kerala", kozhikode: "kerala", thrissur: "kerala",
    coimbatore: "tamilnadu", noida: "nopt", gurugram: "nopt", jaipur: "nopt", indore: "madhyapradesh" },
  surchargeNoteAbove: 5000000,
};

/* ---------- number helpers ---------- */
// Reads a number typed by a person: allows "6,00,000", "₹ 600000", " 50 ". Empty → fallback.
// Returns {v} or {err:"nan"} / {err:"neg"}.
function readNum(raw, fallback) {
  if (raw === undefined || raw === null || raw === "") return { v: fallback };
  if (typeof raw === "number") return Number.isFinite(raw) ? (raw < 0 ? { err: "neg" } : { v: raw }) : { err: "nan" };
  const s = String(raw).replace(/[₹,\s]/g, "");
  if (s === "") return { v: fallback };
  if (!/^-?\d*\.?\d+$/.test(s)) return { err: "nan" };
  const n = parseFloat(s);
  return n < 0 ? { err: "neg" } : { v: n };
}

// Indian grouping: 100308 → "₹1,00,308". Rounds to the nearest rupee (display only).
function inr(n) {
  const neg = n < 0;
  let s = String(Math.round(Math.abs(n)));
  if (s.length > 3) {
    const last3 = s.slice(-3);
    s = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + last3;
  }
  return (neg && Math.round(Math.abs(n)) !== 0 ? "−₹" : "₹") + s;
}
function lpa(n) { return "₹" + (n / 100000).toFixed(1) + " LPA"; }

/* ---------- tax ---------- */
function slabTax(income, slabs) {
  let tax = 0, lower = 0;
  for (const [upper, rate] of slabs) {
    if (income <= lower) break;
    tax += (Math.min(income, upper) - lower) * rate;
    lower = upper;
  }
  return tax;
}

// Tax before cess for a regime, with rebate, rebate marginal relief, surcharge and surcharge marginal relief.
function baseTax(taxable, R) {
  const slab = slabTax(taxable, R.slabs);
  let tax = slab, rebate = 0, relief = 0;
  if (taxable <= R.rebateLimit) { rebate = slab; tax = 0; }
  else if (R.rebateMarginalRelief && slab > taxable - R.rebateLimit) { relief = slab - (taxable - R.rebateLimit); tax = taxable - R.rebateLimit; }
  // surcharge
  let rate = 0, threshold = 0, prevRate = 0;
  for (const [above, r] of R.surcharge) { if (taxable > above) { prevRate = rate; rate = r; threshold = above; } }
  let surcharge = 0, surchargeRelief = 0;
  if (rate > 0) {
    surcharge = tax * rate;
    // Marginal relief: tax + surcharge can't exceed (tax at the threshold with the lower rate) + income above the threshold
    const atThreshold = baseTax(threshold, R);
    const cap = atThreshold.tax + atThreshold.surcharge + (taxable - threshold);
    if (tax + surcharge > cap) { surchargeRelief = tax + surcharge - cap; surcharge = Math.max(0, cap - tax); }
  }
  return { slab, rebate, relief, tax, surcharge, surchargeRelief, surchargeRate: rate };
}

function calcTax(taxable, R, cfg) {
  const b = baseTax(Math.max(0, taxable), R);
  const beforeCess = b.tax + b.surcharge;
  const cess = beforeCess * cfg.cess;
  return Object.assign(b, { beforeCess, cess, total: beforeCess + cess });
}

/* ---------- one offer ---------- */
function isMetro(city, cfg) { return cfg.metroCities.includes(String(city || "").toLowerCase()); }

function ptFor(state, cfg) { const p = cfg.pt[state]; return p ? p.yearly : 0; }
function stateForCity(city, cfg) { return cfg.cityState[String(city || "").toLowerCase()] || ""; }

// input: see field list below. Returns { ok:false, errors:[{field, code}] } or { ok:true, ...result }.
// Cases: best = variable paid in full, likely = expected payout %, worst = variable paid zero.
function calcOffer(input, cfg) {
  cfg = cfg || CONFIG;
  const I = input || {}, errors = [], warnings = [];
  const M = cfg.monthsPerYear;
  const get = (field, fallback) => {
    const r = readNum(I[field], fallback);
    if (r.err) { errors.push({ field, code: r.err }); return fallback; }
    return r.v;
  };
  const metro = I.metro !== undefined ? !!I.metro : isMetro(I.city, cfg);
  const state = I.state !== undefined && I.state !== null ? String(I.state) : stateForCity(I.city, cfg);
  const ctcOffer = get("ctc", 0);
  let basicPct = get("basicPct", cfg.basicPct.def);
  const hraPct = get("hraPct", metro ? cfg.hraPctOfBasic.metro : cfg.hraPctOfBasic.other);
  const varVal = get("variable", 0);
  const likelyPct = get("variableLikely", cfg.variableLikelyPct.def);
  const joiningBonus = get("joiningBonus", 0);
  const bonusMonths = get("bonusMonths", 0);
  const noticeDays = get("noticeDays", 0);
  const ptYearly = get("ptYearly", ptFor(state, cfg));
  const rent = get("rent", 0);
  const travel = get("travel", 0);
  const rentPaid = get("rentPaid", rent);   // old regime HRA: defaults to the rent entered
  const other80C = get("other80C", 0);
  const otherBenefits = get("otherBenefits", 0);
  // Sec 126 (old 80D): the old single field "d80D" is read as the self/family amount.
  const d80DSelfIn = I.d80DSelf !== undefined && I.d80DSelf !== "" ? get("d80DSelf", 0) : get("d80D", 0);
  const d80DParentsIn = get("d80DParents", 0);

  if (!errors.some((e) => e.field === "ctc") && ctcOffer <= 0) errors.push({ field: "ctc", code: "required" });
  if (likelyPct < cfg.variableLikelyPct.min || likelyPct > cfg.variableLikelyPct.max) errors.push({ field: "variableLikely", code: "range" });
  const bonusInCtc = I.bonusInCtc === true;
  if (bonusInCtc && joiningBonus > 0 && ctcOffer > 0 && joiningBonus >= ctcOffer) errors.push({ field: "joiningBonus", code: "too_big_bonus" });
  // A1: if the CTC includes a one-time joining bonus, the recurring CTC is the CTC without it.
  const ctc = bonusInCtc ? ctcOffer - joiningBonus : ctcOffer;
  if (basicPct < cfg.basicPct.min || basicPct > cfg.basicPct.max) {
    warnings.push({ code: "basic_clamped", from: basicPct });
    basicPct = Math.min(cfg.basicPct.max, Math.max(cfg.basicPct.min, basicPct));
  }
  const variable = I.variableType === "pct" ? ctc * varVal / 100 : varVal;
  if (ctc > 0 && variable >= ctc) errors.push({ field: "variable", code: "too_big" });
  if (ctc > 0 && otherBenefits > 0 && variable + otherBenefits >= ctc) errors.push({ field: "otherBenefits", code: "too_big_other" });
  if (errors.length) return { ok: false, errors, warnings };
  if (bonusInCtc && joiningBonus > 0) warnings.push({ code: "bonus_in_ctc", x: joiningBonus, y: ctc });

  const pfIncluded = I.pfIncluded !== false;
  const gratuityIncluded = I.gratuityIncluded !== false;
  const pfCapped = I.pfMode === "capped";

  const basic = ctc * basicPct / 100;
  const hra = basic * hraPct / 100;
  // A5: PF and gratuity are worked out on "wages". With the labour-code rule on, wages are at least
  // 50% of fixed pay (CTC − employer PF − gratuity − variable − other benefits). PF and gratuity depend
  // on wages, so solve by iteration until stable.
  const pfGrat = (w) => {
    const pfBase = pfCapped ? Math.min(w, cfg.pf.wageCeilingMonthly * M) : w;
    const pfAmount = pfBase * cfg.pf.rate;
    return { pfAmount, employerPF: pfIncluded ? pfAmount : 0, gratuity: gratuityIncluded ? w * cfg.gratuityRate : 0 };
  };
  const lcOn = I.labourCodeRule !== false;
  let wages = basic, pg = pfGrat(wages);
  if (lcOn) {
    const share = cfg.labourCodeMinBasicPct / 100;
    for (let i = 0; i < cfg.labourCode.maxRounds; i++) {
      const fixedPay = ctc - pg.employerPF - pg.gratuity - variable - otherBenefits;
      const w = Math.max(basic, share * fixedPay);
      const done = Math.abs(w - wages) < cfg.labourCode.tolerance;
      wages = w; pg = pfGrat(wages);
      if (done) break;
    }
  }
  const lcApplied = lcOn && wages > basic + 0.5;
  if (lcApplied) warnings.push({ code: "lc_applied", x: wages });
  const labourCodeWarn = !lcOn && basicPct < cfg.labourCodeMinBasicPct;
  if (labourCodeWarn) warnings.push({ code: "basic_labour" });

  const employerPF = pg.employerPF, gratuity = pg.gratuity, employeePF = pg.pfAmount;
  const fixedGross = ctc - employerPF - gratuity - variable - otherBenefits;   // A6: other benefits are not cash
  if (fixedGross <= 0) return { ok: false, errors: [{ field: "variable", code: "too_big" }], warnings };
  const pt = ptYearly;

  // A2: Sec 126 (old 80D) caps
  const cap80 = cfg.oldRegime.s80D;
  const parentsCap = I.parentsSenior === true ? cap80.parentsSenior : cap80.parents;
  const d80DSelf = Math.min(d80DSelfIn, cap80.self), d80DParents = Math.min(d80DParentsIn, parentsCap);
  const d80D = d80DSelf + d80DParents;

  function regimes(gross) {
    const N = cfg.newRegime, O = cfg.oldRegime;
    const newTaxable = Math.max(0, gross - N.stdDeduction);
    const nT = calcTax(newTaxable, N, cfg);
    const hraActual = Math.min(hra, gross);
    const rentY = rentPaid * M;
    const hraExempt = rentY > 0 ? Math.max(0, Math.min(hraActual, rentY - O.hraRentFloorPctOfBasic * basic, (metro ? O.hraCapMetro : O.hraCapOther) * basic)) : 0;
    const ded80C = Math.min(employeePF + other80C, O.sec80CLimit);
    const oldTaxable = Math.max(0, gross - O.stdDeduction - hraExempt - ded80C - d80D - pt);
    const oT = calcTax(oldTaxable, O, cfg);
    const mk = (taxable, T) => {
      const inHandYearly = gross - employeePF - pt - T.total;
      const inHandMonthly = inHandYearly / M;
      return { taxable, tax: T, inHandYearly, inHandMonthly, moneyLeft: inHandMonthly - rent - travel };
    };
    const n = mk(newTaxable, nT), o = mk(oldTaxable, oT);
    o.hraExempt = hraExempt; o.ded80C = ded80C; o.d80D = d80D;
    const cheaper = o.tax.total < n.tax.total ? "old" : "new";
    const pick = cheaper === "old" ? o : n;
    return { gross, new: n, old: o, cheaper, inHandMonthly: pick.inHandMonthly, inHandYearly: pick.inHandYearly, moneyLeft: pick.moneyLeft, tax: pick.tax.total };
  }

  const pLikely = likelyPct / 100;
  const best = regimes(fixedGross + variable);
  const likely = regimes(fixedGross + variable * pLikely);
  const worst = regimes(fixedGross);
  const cases = { best, likely, worst };

  // A1: joining bonus in year 1. Extra tax = tax(gross + bonus) − tax(gross) in the regime the case uses,
  // so the rebate and the "just over ₹12 lakh" relief apply exactly as for salary.
  for (const k of ["best", "likely", "worst"]) {
    const c = cases[k];
    if (joiningBonus > 0) {
      const R = c.cheaper, withB = regimes(c.gross + joiningBonus);
      const extraTax = withB[R].tax.total - c[R].tax.total;
      const net = joiningBonus - extraTax;
      // The bonus lifts taxable income past the rebate limit, so the whole rebate is lost: a big share of the bonus goes in tax.
      const lostRebate = c[R].tax.rebate > 0 && withB[R].tax.rebate === 0;
      c.bonus = { gross: joiningBonus, extraTax, net, firstMonth: c.inHandMonthly + net, firstYearTotal: c.inHandYearly + net, regime: R, lostRebate,
        highTax: lostRebate || extraTax > joiningBonus * cfg.bonusHighTaxNotePct / 100 };
    } else c.bonus = null;
  }

  // "Where your CTC goes" — segments that add up to the offer CTC, for each case, using that case's cheaper regime.
  function split(caseKey) {
    const c = cases[caseKey] || best;
    const R = c.cheaper;
    const inHandY = c[R].inHandYearly;
    const segs = [];
    if (caseKey === "worst") {
      segs.push({ key: "inhand", value: inHandY });
      segs.push({ key: "variable_unpaid", value: variable });
    } else {
      const sureY = worst[R].inHandYearly;           // in-hand even if variable is zero (same regime)
      segs.push({ key: "inhand", value: sureY });
      segs.push({ key: "variable_risk", value: inHandY - sureY });
      if (caseKey === "likely") segs.push({ key: "variable_unpaid", value: variable * (1 - pLikely) });
    }
    segs.push({ key: "pf", value: employerPF + employeePF });
    segs.push({ key: "tax", value: c[R].tax.total });
    segs.push({ key: "pt", value: pt });
    segs.push({ key: "gratuity", value: gratuity });
    segs.push({ key: "other", value: otherBenefits });
    if (bonusInCtc) segs.push({ key: "joining", value: joiningBonus });
    const total = segs.reduce((s, x) => s + x.value, 0);
    segs.forEach((x) => { x.pct = ctcOffer > 0 ? x.value / ctcOffer * 100 : 0; });
    return { segs: segs.filter((x) => x.value > 0.0001), total };
  }

  // A7: notice buyout on gross (default, the safer estimate) or basic
  const noticeBasis = I.noticeBasis === "basic" ? "basic" : "gross";
  const perMonth = noticeBasis === "basic" ? basic / M : fixedGross / M;
  const buyout = perMonth / cfg.noticeDaysPerMonth * noticeDays;
  if (ctc > cfg.surchargeNoteAbove) warnings.push({ code: "surcharge_included" });
  // Just above the rebate limit the relief caps tax at (taxable − limit) and cess is added on top, so each extra
  // rupee of pay costs a little more than a rupee in tax: more pay can mean slightly less in-hand.
  if (["best", "likely", "worst"].some((k) => cases[k].cheaper === "new" && cases[k].new.tax.relief > 0)) warnings.push({ code: "rebate_edge" });
  if (["best", "likely", "worst"].some((k) => cases[k][cases[k].cheaper].tax.surchargeRelief > 0)) warnings.push({ code: "surcharge_edge" });
  const ptInfo = cfg.pt[state];
  if (ptInfo && ptInfo.fromMonthly && fixedGross / M < ptInfo.fromMonthly && ptYearly === ptInfo.yearly) warnings.push({ code: "pt_lower" });
  if (state === "" && (I.ptYearly === undefined || I.ptYearly === "")) warnings.push({ code: "pt_pick" });

  return {
    ok: true, warnings, labourCodeWarn, label: I.label || "", city: I.city || "", metro, state,
    ctc: ctcOffer, ctcRecurring: ctc, basicPct, basic, hra, wages, lcApplied, employerPF, employeePF, gratuity, variable, likelyPct,
    otherBenefits, fixedGross, pt, rent, travel, d80D: { self: d80DSelfIn, selfCounted: d80DSelf, parents: d80DParentsIn, parentsCounted: d80DParents, parentsCap },
    best, likely, worst, split, buyout, noticeBasis, noticeDays,
    joiningBonus: joiningBonus > 0 ? { amount: joiningBonus, months: bonusMonths, inCtc: bonusInCtc } : null,
  };
}

/* ---------- compare ---------- */
// results: array of calcOffer() results (ok ones). caseKey: "best" | "likely" | "worst".
// A3: a difference under CONFIG.tieThresholdMonthly (₹/month) is a tie; lead is whole rupees.
function compareOffers(results, caseKey, cfg) {
  cfg = cfg || CONFIG;
  const rows = results.map((r, i) => ({ i, r, left: (r[caseKey] || r.best).moneyLeft }))
    .sort((a, b) => b.left - a.left);
  const diff = rows.length > 1 ? rows[0].left - rows[1].left : 0;
  const winner = rows.length > 1 && diff >= cfg.tieThresholdMonthly ? rows[0].i : null;
  const lead = winner !== null ? Math.round(diff) : 0;
  return { rows, winner, lead };
}

/* ---------- saved-data migration (pure) ---------- */
// v2 → v3: the single 80D field becomes the self/family field; state "delhi" becomes "nopt".
function migrateState(d) {
  const out = JSON.parse(JSON.stringify(d || {}));
  if (!Array.isArray(out.offers)) return out;
  out.offers = out.offers.map((o) => {
    const x = Object.assign({}, o);
    if (x.d80D !== undefined) { if (x.d80DSelf === undefined) x.d80DSelf = x.d80D; delete x.d80D; }
    if (x.state === "delhi") x.state = "nopt";
    return x;
  });
  return out;
}

<script>
/* =====================================================================
   Wiz premium kit: helpers (theme, toast, confetti, SVG charts)
   No libraries, no internet needed. Everything draws with inline SVG.
   ===================================================================== */
const WZ = (() => {
  const NS = "http://www.w3.org/2000/svg";

  /* Theme: light by default, remembers the choice under the given key. */
  function initTheme(key, toggleEl) {
    let t = "light";
    try { t = localStorage.getItem(key) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
    document.documentElement.dataset.theme = t;
    if (toggleEl) toggleEl.addEventListener("click", () => {
      t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem(key, t); } catch (e) {}
      document.dispatchEvent(new Event("wz-theme"));
    });
  }

  function toast(el, msg) {
    el.textContent = msg; el.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), 1900);
  }

  /* Confetti burst (respects reduced-motion). */
  function confetti(n = 120) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"), x = c.getContext("2d");
    Object.assign(c.style, { position: "fixed", inset: "0", width: "100%", height: "100%", pointerEvents: "none", zIndex: 90 });
    document.body.appendChild(c);
    const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
    const cols = ["#2DBD6E", "#F5B83D", "#7C5CBF", "#F4645F", "#2F7FD8", "#FFE58A"];
    const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio, s: (6 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[n % cols.length], k: Math.random() }));
    ps.forEach((p, i) => p.c = cols[i % cols.length]);
    let f = 0;
    (function tick() {
      x.clearRect(0, 0, W, H); f++;
      ps.forEach((p) => { p.vy += .45 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * (p.k > .5 ? .6 : .35)); x.restore(); });
      if (f < 150) requestAnimationFrame(tick); else c.remove();
    })();
  }

  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  /* Donut chart. data: [{label, value, color}] ; centre: {big, small} */
  function donut(box, data, centre) {
    box.innerHTML = "";
    const total = data.reduce((s, d) => s + d.value, 0);
    const svg = el("svg", { viewBox: "0 0 200 200", width: "100%", style: "max-width:220px;display:block;margin:auto" }, box);
    const R = 78, C = 2 * Math.PI * R;
    el("circle", { cx: 100, cy: 100, r: R, fill: "none", stroke: cssVar("--accent-ultra"), "stroke-width": 26 }, svg);
    let off = 0;
    data.forEach((d) => {
      if (!total || !d.value) return;
      const len = d.value / total * C;
      const arc = el("circle", { cx: 100, cy: 100, r: R, fill: "none", stroke: d.color, "stroke-width": 26, "stroke-dasharray": `${Math.max(0, len - 2)} ${C}`, "stroke-dashoffset": -off, transform: "rotate(-90 100 100)", "stroke-linecap": "butt" }, svg);
      el("title", {}, arc).textContent = d.label;
      off += len;
    });
    if (centre) {
      const t1 = el("text", { x: 100, y: 98, "text-anchor": "middle", class: "wz-chart-big", "font-size": centre.big.length > 9 ? 19 : 23 }, svg); t1.textContent = centre.big;
      const t2 = el("text", { x: 100, y: 120, "text-anchor": "middle", class: "wz-chart-text" }, svg); t2.textContent = centre.small || "";
    }
  }

  /* Half-circle gauge for a percentage (0–100+). */
  function gauge(box, pct, label) {
    box.innerHTML = "";
    const p = Math.max(0, Math.min(100, pct));
    const col = pct > 50 ? cssVar("--coral") : pct > 30 ? cssVar("--amber") : cssVar("--accent");
    const svg = el("svg", { viewBox: "0 0 120 72", width: "100%", style: "max-width:150px;display:block;margin:auto" }, box);
    const arc = (a) => { const r = 48, cx = 60, cy = 62, ang = Math.PI * (1 - a); return `${cx + r * Math.cos(ang)} ${cy - r * Math.sin(ang)}`; };
    el("path", { d: `M ${arc(0)} A 48 48 0 0 1 ${arc(1)}`, fill: "none", stroke: cssVar("--accent-ultra"), "stroke-width": 11, "stroke-linecap": "round" }, svg);
    if (p > 0) el("path", { d: `M ${arc(0)} A 48 48 0 0 1 ${arc(p / 100)}`, fill: "none", stroke: col, "stroke-width": 11, "stroke-linecap": "round" }, svg);
    const t = el("text", { x: 60, y: 60, "text-anchor": "middle", class: "wz-chart-big", "font-size": 20 }, svg); t.textContent = Math.round(pct) + "%";
    if (label) { const l = el("text", { x: 60, y: 71, "text-anchor": "middle", class: "wz-chart-text", "font-size": 9 }, svg); l.textContent = label; }
  }

  /* Area chart: series [{values:[...], color, dashed}] ; xLabels: array (same length) */
  function area(box, series, xLabels, fmt) {
    box.innerHTML = "";
    const W = 600, H = 220, P = { l: 52, r: 12, t: 14, b: 28 };
    const n = Math.max(...series.map((s) => s.values.length));
    const max = Math.max(1, ...series.flatMap((s) => s.values));
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "display:block" }, box);
    const X = (i) => P.l + (n <= 1 ? 0 : i / (n - 1) * (W - P.l - P.r)), Y = (v) => P.t + (1 - v / max) * (H - P.t - P.b);
    for (let g = 0; g <= 3; g++) {
      const v = max * g / 3, y = Y(v);
      el("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, stroke: cssVar("--border"), "stroke-width": 1 }, svg);
      const t = el("text", { x: P.l - 6, y: y + 4, "text-anchor": "end", class: "wz-chart-text" }, svg); t.textContent = fmt ? fmt(v) : Math.round(v);
    }
    const step = Math.max(1, Math.ceil(n / 6));
    (xLabels || []).forEach((lab, i) => { if ((i % step === 0 && (i === n - 1 || n - 1 - i >= step * 0.8)) || i === n - 1) { const t = el("text", { x: X(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", class: "wz-chart-text" }, svg); t.textContent = lab; } });
    series.forEach((s, si) => {
      if (!s.values.length) return;
      const id = "wzg" + Math.random().toString(36).slice(2, 7);
      const defs = el("defs", {}, svg), lg = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      el("stop", { offset: "0%", "stop-color": s.color, "stop-opacity": s.dashed ? 0 : .28 }, lg);
      el("stop", { offset: "100%", "stop-color": s.color, "stop-opacity": 0 }, lg);
      const pts = s.values.map((v, i) => `${X(i)},${Y(v)}`).join(" ");
      if (!s.dashed) el("polygon", { points: `${X(0)},${Y(0)} ${pts} ${X(s.values.length - 1)},${Y(0)}`, fill: `url(#${id})` }, svg);
      el("polyline", { points: pts, fill: "none", stroke: s.color, "stroke-width": s.dashed ? 2 : 3, "stroke-dasharray": s.dashed ? "6 6" : "", "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
      const last = s.values.length - 1;
      if (!s.dashed) el("circle", { cx: X(last), cy: Y(s.values[last]), r: 5, fill: s.color, stroke: cssVar("--surface"), "stroke-width": 2 }, svg);
    });
  }

  return { initTheme, toast, confetti, donut, gauge, area, cssVar };
})();

</script>

// Which professional-tax state each city is in: CONFIG.cityState ("nopt" = no professional tax; "other" has none).
const STATES = Object.keys(CONFIG.pt).concat(["custom"]);
const KEY = "offercheck.v1", MAX_OFFERS = 3;

/* ---------- state ---------- */
let S = { lang: "en", offers: [blankOffer()], cur: 0, kase: "likely", adv: false, old: false };

/* ---------- text ---------- */
function L() { return STRINGS[S.lang] || STRINGS.en; }

const $ = (id) => document.getElementById(id);

function vars() { const c80 = CONFIG.oldRegime.s80D; return { c80s: inr(c80.self).slice(1), c80p: inr(c80.parents).slice(1), c80ps: inr(c80.parentsSenior).slice(1), tie: inr(CONFIG.tieThresholdMonthly), cess: pctOf(CONFIG.cess), per: "₹" + (1 + CONFIG.cess).toFixed(2), min: CONFIG.basicPct.min, max: CONFIG.basicPct.max, cap: capTxt(), pf: pctOf(CONFIG.pf.rate), g: pctOf(CONFIG.gratuityRate), m: pctOf(CONFIG.oldRegime.hraCapMetro), o: pctOf(CONFIG.oldRegime.hraCapOther), lim: inr(CONFIG.oldRegime.sec80CLimit).slice(1), lc: CONFIG.labourCodeMinBasicPct, s80c: secLabel("s80c"), s80d: secLabel("s80d"), s87a: secLabel("s87a"), ssd: secLabel("ssd"), sdn: inr(CONFIG.newRegime.stdDeduction), sdo: inr(CONFIG.oldRegime.stdDeduction), rb: inr(CONFIG.newRegime.rebateLimit) }; }

function fieldHTML(f, o) {

function renderForm() {

// Live updates while typing: errors, LPA line, preview. Inputs are not re-rendered (keeps focus).
function updateLive() {
  const o = S.offers[S.cur], r = calcOffer(engineInput(o), CONFIG);
  document.querySelectorAll(".fld.bad").forEach((e) => e.classList.remove("bad"));
  const msgs = [];
  if (!r.ok) {
    r.errors.forEach((e) => {
      const fl = $("fld_" + e.field); if (fl) fl.classList.add("bad");
      const f = [].concat(F.quick, F.adv, F.old).find((x) => x.k === e.field);
      msgs.push({ cls: "coral", txt: t("err_" + e.code, { f: f ? fieldLabel(f).replace(/\s*\(.*\)$/, "") : e.field }) });
    });
  }
  (r.warnings || []).forEach((w) => msgs.push({ cls: "amber", txt: warnTxt(w, r) }));
  // keep only the first error per field
  const seen = new Set();
  $("errs").innerHTML = msgs.filter((m) => !seen.has(m.txt) && seen.add(m.txt)).map((m) => `<div class="wz-alert ${m.cls}">${esc(m.txt)}</div>`).join("");

  $("un_ctc").textContent = !ctcN.err && ctcN.v > 0 ? t("lpa_eq", { v: lpa(ctcN.v) }) : "";

/* ---------- screen 2: real salary ---------- */

function countUp(el, to) {

}

  const jbCard = jb ? `<div class="wz-card"><p class="wz-label">🎁 ${esc(t("h_jb"))}</p><table class="btable">
      <tr><td>${esc(t("jb_gross"))}</td><td>${inr(jb.gross)}</td></tr>
      <tr><td>${esc(t("jb_tax"))}</td><td class="minus">− ${inr(jb.extraTax)}</td></tr>
      <tr class="tot"><td>${esc(t("jb_net"))}</td><td>${inr(jb.net)}</td></tr>
      <tr><td>${esc(t("jb_first"))}</td><td>${inr(jb.firstMonth)}</td></tr>
      <tr><td>${esc(t("jb_year"))}</td><td>${inr(jb.firstYearTotal)}</td></tr></table>
      ${jb.highTax ? `<div class="wz-alert amber" style="margin-top:10px">${esc(t(jb.lostRebate ? "jb_lost_rebate" : "jb_high_tax", vars()))}</div>` : ""}
      <p class="wz-hint" style="margin:10px 0 0">${esc(t("jb_note", { r: rName(jb.regime) }))}</p></div>` : "";
  $("salBody").innerHTML = `
    <div class="wz-card hero">
      <p class="wz-label">${esc(t("k_inhand"))} · ${esc(offerName(S.offers[S.cur], S.cur))}</p>
      <div class="big" id="bigNum">${inr(shown)}</div>
      <div class="meta">${esc(t("per_year", { v: inr(c[R].inHandYearly) }))} · ${esc(rName(R))} · ${esc(t("ctc_is", { v: lpa(r.ctc) }))}</div>
      <div style="margin-top:14px">${r.variable > 0 ? caseSeg("salCase") : `<span class="wz-hint">${esc(t("no_var"))}</span>`}</div>
    </div>
    <div class="wz-card"><p class="wz-label">${esc(t("h_bar"))}</p><p class="wz-hint">${esc(t("hint_bar", { v: inr(r.ctc) }))}</p><div class="cbar" id="cbar" role="img" aria-label="${esc(t("h_bar"))}">${segs}</div><div class="legend">${legend}</div></div>
    <p class="wz-label" style="margin:22px 0 0">${esc(t("h_regime"))}</p>
    <div class="wz-grid wz-g2">${rc("new")}${rc("old")}</div>
    <div class="wz-alert accent" style="margin-top:12px">${esc(note)}</div>
    <p class="wz-hint" style="margin:8px 2px 0">${esc(t("regime_rules", vars()))}</p>
    <div class="wz-card"><p class="wz-label">${esc(t("h_break"))}</p>${table}</div>
    ${jbCard}
    ${warn.length ? `<div class="wz-card"><p class="wz-label">⚠️ ${esc(t("h_watch"))}</p><div class="alerts">${warn.map((w) => `<div class="wz-alert amber">${esc(w)}</div>`).join("")}</div></div>` : ""}`;
  const target = c[R].inHandMonthly;
  if (animate) countUp($("bigNum"), target); else { shown = target; $("bigNum").textContent = inr(target); }
}

/* ---------- screen 3: compare ---------- */
function renderCompare() {
  const rs = results(), valid = rs.map((r, i) => ({ r, i })).filter((x) => x.r.ok);
  const skipped = rs.length - valid.length;
  const anyVar = valid.some((x) => x.r.variable > 0);
  $("cmpCase").innerHTML = anyVar ? caseSeg("cmpCaseSeg") : "";
  if (valid.length < 2) {
    $("cmpBody").innerHTML = `<div class="wz-card"><div class="wz-empty">${esc(t("empty_cmp"))}${S.offers.length < MAX_OFFERS ? `<div style="margin-top:12px"><button type="button" class="wz-btn sm" data-addgo="1">${esc(t("b_add_another"))}</button></div>` : ""}</div></div>`;
    return;
  }
  const cmp = compareOffers(valid.map((x) => x.r), S.kase);
  const anyJB = valid.some((x) => x.r.joiningBonus);
  const cards = cmp.rows.map((row) => {
    const { r } = row, idx = valid[row.i].i, c = r[S.kase], win = cmp.winner === row.i;
    const left = c.moneyLeft;
    return `<div class="wz-card ocard${win ? " rcard win" : ""}">
      ${win ? `<span class="wz-badge">🏆 ${esc(t("better"))}</span>` : ""}
      <h3>${esc(offerName(S.offers[idx], idx))}</h3>
      <div class="meta">${esc(t("ctc_is", { v: lpa(r.ctc) }))} · ${esc(t("c_" + (S.offers[idx].city || "other")))} · ${esc(t(c.cheaper === "new" ? "r_new" : "r_old"))}</div>
      <div class="kv"><span>${esc(t("k_inhand"))}</span><b class="c-accent">${inr(c.inHandMonthly)}</b></div>
      <div class="kv"><span>${esc(t("k_minus_rent"))}</span><b class="c-coral">${inr(r.rent)}</b></div>
      <div class="kv"><span>${esc(t("k_minus_travel"))}</span><b class="c-coral">${inr(r.travel)}</b></div>
      <div class="kv left"><span>${esc(t("k_left"))}</span><b class="${left < 0 ? "neg" : "c-accent"}">${inr(left)}</b></div>
      ${anyJB ? `<div class="kv"><span>${esc(t("k_firstyear"))}</span><b>${inr(c.bonus ? c.bonus.firstYearTotal : c.inHandYearly)}</b></div>` : ""}
      ${left < 0 ? `<div class="why neg">${esc(t("negative_note"))}</div>` : ""}
      ${win ? `<div class="why">${esc(t("reason", { v: inr(cmp.lead) }))}</div>` : ""}
    </div>`;
  }).join("");
  $("cmpBody").innerHTML = `<div class="ogrid${valid.length === 2 ? " n2" : ""}" style="margin-top:16px">${cards}</div>
    ${cmp.winner === null ? `<div class="wz-alert accent" style="margin-top:14px">${esc(t("tie", vars()))}</div>` : ""}
    ${skipped ? `<p class="wz-hint" style="margin-top:12px">${esc(t("skipped", { n: S.offers.map((o, i) => rs[i].ok ? null : offerName(o, i)).filter(Boolean).join(", ") }))}</p>` : ""}`;
}

/* ---------- screen 4: decision sheet ---------- */
function fmtDate(d) { try { return d.toLocaleDateString(S.lang === "ml" ? "ml-IN" : "en-IN", { day: "numeric", month: S.lang === "ml" ? "long" : "short", year: "numeric" }); } catch (e) { return d.toDateString(); } }
function footTxt() { return t("footer", { fy: CONFIG.fy, fyY: CONFIG.fy.replace(/^FY\s*/, "") }); }
function verTxt() { return t("verified", { d: fmtDate(new Date(CONFIG.verifiedOn + "T00:00:00")) }); }
function today() { try { return new Date().toLocaleDateString(S.lang === "ml" ? "ml-IN" : "en-IN", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return new Date().toDateString(); } }
function sheetData() {
  const rs = results(), valid = rs.map((r, i) => ({ r, i })).filter((x) => x.r.ok);
  const cmp = compareOffers(valid.map((x) => x.r), S.kase);
  return { valid, cmp };
}
function renderSheet() {
  const { valid, cmp } = sheetData();
  const caseTxt = caseLabel(S.kase);
  const anyVar = valid.some((x) => x.r.variable > 0);
  let body = `<h2>📄 ${esc(t("sheet_h"))}</h2><div class="dt">${esc(t("sheet_date", { d: today() }))} · Offer Check by Wiz Designs</div>`;
  if (!valid.length) { $("sheetBody").innerHTML = body + `<div class="wz-empty">${esc(t("sheet_empty"))}</div>` + fine(); return; }
  const rowsH = cmp.rows.map((row) => {
    const { r } = row, idx = valid[row.i].i, c = r[S.kase];
    return `<tr class="${cmp.winner === row.i ? "w" : ""}"><td>${cmp.winner === row.i ? "🏆 " : ""}${esc(offerName(S.offers[idx], idx))}</td><td class="n">${lpa(r.ctc)}</td><td class="n">${inr(c.inHandMonthly)}</td><td class="n">${inr(r.rent)}</td><td class="n">${inr(r.travel)}</td><td class="n" style="${c.moneyLeft < 0 ? "color:#D9443F" : ""}">${inr(c.moneyLeft)}</td><td>${esc(t(c.cheaper === "new" ? "r_new" : "r_old"))}</td></tr>`;
  }).join("");
  body += `<div class="scroll-x"><table class="stbl"><thead><tr><th>${esc(t("col_offer"))}</th><th class="n">${esc(t("col_ctc"))}</th><th class="n">${esc(t("col_inhand"))}</th><th class="n">${esc(t("col_rent"))}</th><th class="n">${esc(t("col_travel"))}</th><th class="n">${esc(t("col_left"))}</th><th>${esc(t("col_regime"))}</th></tr></thead><tbody>${rowsH}</tbody></table></div>`;
  body += `<div class="wline">${esc(sheetHeadline(valid, cmp))}</div>`;
  const notes = sheetNotes(valid);
  if (notes.length) body += `<p class="wz-label" style="margin:16px 0 0;color:#3D5C3D">⚠️ ${esc(t("sheet_notes"))}</p><ul>${notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`;
  body += `<p style="font-size:12.5px;color:#3D5C3D;margin:12px 0 0">${esc(anyVar ? t("sheet_case", { c: caseTxt }) : t("sheet_case_novar"))}</p>` + fine();
  $("sheetBody").innerHTML = body;
}
function sheetHeadline(valid, cmp) {
  const name = (row) => { const idx = valid[row.i].i; return offerName(S.offers[idx], idx); };
  if (valid.length === 1) return t("sheet_one", { o: name(cmp.rows[0]), v: inr(cmp.rows[0].left) });
  if (cmp.winner === null) return t("sheet_tie", vars());
  return t("sheet_winner", { o: name(cmp.rows[0]), v: inr(cmp.lead) });
}
function sheetNotes(valid) {
  const notes = [];
  valid.forEach(({ r, i }) => {
    const n = offerName(S.offers[i], i) + ": ";
    const c = r[S.kase];
    if (c.bonus) notes.push(n + t("sheet_bonus", { g: inr(c.bonus.gross), n: inr(c.bonus.net), f: inr(c.bonus.firstYearTotal) }) + " " + paybackTxt(r.joiningBonus));
    if (r.noticeDays > 0) notes.push(n + noticeTxt(r));
  });
  return notes;
}
function fine() { return `<div class="fine">${esc(footTxt())} ${esc(verTxt())}.</div>`; }
function shareText() {
  const { valid, cmp } = sheetData();
  if (!valid.length) return t("sheet_empty");
  const lines = [t("sheet_h") + " — " + today(), ""];
  cmp.rows.forEach((row) => {
    const { r } = row, idx = valid[row.i].i, c = r[S.kase];
    lines.push((cmp.winner === row.i ? "🏆 " : "• ") + offerName(S.offers[idx], idx) + " (" + lpa(r.ctc) + ")");
    lines.push("   " + t("col_inhand") + ": " + inr(c.inHandMonthly) + " · " + t("col_rent") + ": " + inr(r.rent) + " · " + t("col_travel") + ": " + inr(r.travel) + " · " + t("col_left") + ": " + inr(c.moneyLeft));
  });
  lines.push("", sheetHeadline(valid, cmp));
  sheetNotes(valid).forEach((n) => lines.push("⚠️ " + n));
  lines.push("", valid.some((x) => x.r.variable > 0) ? t("sheet_case", { c: caseLabel(S.kase) }) : t("sheet_case_novar"), footTxt());
  return lines.join("\n");
}
async function doShare() {
  const text = shareText();
  if (navigator.share) {
    try { await navigator.share({ title: t("share_title"), text }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); WZ.toast($("toast"), t("copied")); $("shareBox").hidden = true; return; } catch (e) {}
  $("shareText").value = text; $("shareBox").hidden = false; $("shareText").focus(); $("shareText").select();
}

/* ---------- language, tabs, render ---------- */
let tab = "offer";
function applyLang() {
  document.documentElement.lang = S.lang === "ml" ? "ml" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $("lEN").classList.toggle("on", S.lang !== "ml"); $("lML").classList.toggle("on", S.lang === "ml");
  $("ftDisc").textContent = footTxt();
  $("ftVer").textContent = verTxt();
  $("hdrDate").textContent = today();
}
function showTab(name) {
  tab = name;
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll("section.scr").forEach((s) => s.classList.toggle("on", s.id === name));
  if (name === "salary") renderSalary(true);
  if (name === "compare") renderCompare();
  if (name === "sheet") renderSheet();
  scrollTo({ top: 0 });
}
function renderAll() { applyLang(); renderForm(); if (tab === "salary") renderSalary(false); if (tab === "compare") renderCompare(); if (tab === "sheet") renderSheet(); }

function addOffer(go) {
  if (S.offers.length >= MAX_OFFERS) { WZ.toast($("toast"), t("max3")); return; }
  const prev = S.offers[S.cur] || {};
  S.offers.push({ label: "", ctc: "", city: prev.city || "kochi", rent: "" });
  S.cur = S.offers.length - 1; save(); renderForm(); WZ.toast($("toast"), t("added"));
  if (go) showTab("offer");
  const el = $("in_ctc"); if (el) el.focus();
}
function loadSamples() {
  S.offers = [
    { label: t("sample1"), ctc: "600000", city: "kochi", rent: "9000", travel: "1500", noticeDays: "30" },
    { label: t("sample2"), ctc: "850000", city: "bengaluru", rent: "22000", travel: "3000", variableType: "pct", variable: "10", joiningBonus: "50000", bonusMonths: "12", noticeDays: "90" },
    { label: t("sample3"), ctc: "720000", city: "thiruvananthapuram", rent: "10000", travel: "1800", noticeDays: "60" },
  ];
  S.cur = 0; save(); renderForm(); WZ.confetti(80);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { showTab(b.dataset.tab); return; }
  if (b.dataset.goto) { showTab(b.dataset.goto); return; }
  if (b.dataset.addgo) { addOffer(true); return; }
  if (b.dataset.offer !== undefined) {
    S.cur = +b.dataset.offer; save();
    if (tab === "salary") { renderForm(); renderSalary(true); } else renderForm();
    return;
  }
  if (b.dataset.case) { S.kase = b.dataset.case; save(); if (tab === "salary") renderSalary(true); if (tab === "compare") renderCompare(); updateLive(); return; }
  if (b.dataset.help) {
    const hl = $("hl_" + b.dataset.help), open = hl.hidden;
    hl.hidden = !open; b.setAttribute("aria-expanded", open); return;
  }
  if (b.dataset.k) {   // segmented choices
    const o = S.offers[S.cur], k = b.dataset.k, raw = b.dataset.v;
    o[k] = raw === "true" ? true : raw === "false" ? false : raw;
    b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    save(); updateLive(); return;
  }
  switch (b.id) {
    case "bAdd": addOffer(false); break;
    case "bRemove":
      if (S.offers.length > 1) { S.offers.splice(S.cur, 1); S.cur = Math.max(0, S.cur - 1); save(); renderForm(); WZ.toast($("toast"), t("removed")); }
      break;
    case "bSample": loadSamples(); break;
    case "tAdv": S.adv = !S.adv; save(); $("advBox").hidden = !S.adv; b.setAttribute("aria-expanded", S.adv); break;
    case "tOld": S.old = !S.old; save(); $("oldBox").hidden = !S.old; b.setAttribute("aria-expanded", S.old); break;
    case "bSee": showTab("salary"); break;
    case "bPrint": renderSheet(); window.print(); break;
    case "bShare": doShare(); break;
    case "bReset": $("mReset").classList.add("on"); $("bResetNo").focus(); break;
    case "bResetNo": $("mReset").classList.remove("on"); break;
    case "bResetYes":
      S = { lang: S.lang, offers: [blankOffer()], cur: 0, kase: "likely", adv: false, old: false };
      try { localStorage.removeItem(KEY); } catch (err) {}
      save(); $("mReset").classList.remove("on"); $("shareBox").hidden = true; renderAll(); WZ.toast($("toast"), t("reset_done"));
      break;
    case "lEN": S.lang = "en"; save(); renderAll(); break;
    case "lML": S.lang = "ml"; save(); renderAll(); break;
  }
});
$("mReset").addEventListener("click", (e) => { if (e.target.id === "mReset") $("mReset").classList.remove("on"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("mReset").classList.remove("on"); });
document.addEventListener("input", (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.k || el.tagName === "SELECT") return;
  S.offers[S.cur][el.dataset.k] = el.value; save(); updateLive();
});
document.addEventListener("change", (e) => {
  const el = e.target; if (el.tagName !== "SELECT" || !el.dataset.k) return;
  const o = S.offers[S.cur];
  if (el.dataset.k === "city") { o.city = el.value; delete o.state; delete o.ptYearly; delete o.metro; }
  if (el.dataset.k === "state") { o.state = el.value; delete o.ptYearly; }
  save(); renderForm();
});

/* ---------- start ---------- */
load();
WZ.initTheme("offercheck.theme", $("themeSw"));
renderAll();
showTab("offer");
</script>
</body>
</html>
