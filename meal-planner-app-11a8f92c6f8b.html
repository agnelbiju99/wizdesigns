<style>:root {
--bg: #111110; --card: #1A1917; --card2: #151412; --border: #2E2C27; --gold-border: #3A3220;
--text: #F3EFE7; --text2: #9C968C; --gold: #E3B566; --gold-text: #E3B566; --on-gold: #111110; --gold-hover: #F2CF8E;
--coral: #F08A6B; --coral-text: #F08A6B; --good: #8FD3A8; --good-text: #8FD3A8; --ph: #2A2520;
--gold-tint: rgba(227, 181, 102, .10); --coral-tint: rgba(240, 138, 107, .12);
--shadow: 0 1px 0 rgba(255, 255, 255, .02), 0 8px 24px rgba(0, 0, 0, .25);
--serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
--sans: 'Sora', 'Noto Sans Malayalam', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
--radius: 18px; --tab-h: 68px;
color-scheme: dark;
}
[data-theme="light"] {
--bg: #FBF8F3; --card: #FFFFFF; --card2: #F7F2EA; --border: #E4DCCF; --gold-border: #E6D3AB;
--text: #1E1B16; --text2: #6B6257; --gold-text: #8A5D0F; --coral-text: #B4472A; --good-text: #2F7A4F; --ph: #F1E9DC;
--gold-tint: rgba(227, 181, 102, .16); --coral-tint: rgba(240, 138, 107, .14);
--shadow: 0 1px 2px rgba(60, 40, 10, .05), 0 8px 24px rgba(60, 40, 10, .06);
color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body.lang-ml { line-height: 1.6; }
a { color: var(--gold-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; vertical-align: middle; }
.ic.big { width: 32px; height: 32px; color: var(--gold-text); display: block; margin: 0 auto 8px; }
.muted { color: var(--text2); }
.small { font-size: 13px; }
.warn { color: var(--gold-text); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.good { color: var(--good-text); font-weight: 700; }
.coral { color: var(--coral-text); font-weight: 700; }
.missing { color: var(--gold-text); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.error { color: var(--coral-text); font-size: 13.5px; font-weight: 600; margin-top: 6px; }
.req { color: var(--coral-text); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.wz-header { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.wz-header .in { display: flex; align-items: center; gap: 10px; padding: 10px 16px; max-width: 1240px; margin: 0 auto; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; flex: none; }
.logo .ic { width: 24px; height: 24px; }
.brand { flex: 1; min-width: 0; }
.brand .n { font: 400 19px/1.1 var(--serif); letter-spacing: .1px; }
.brand .n b { font-weight: 400; color: var(--gold-text); }
.brand .by { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text2); margin-top: 2px; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.hdr-date { display: none; color: var(--text2); font-size: 13px; }
.theme-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--gold-text); display: grid; place-items: center; cursor: pointer; }
.seg-mini { display: flex; border: 1px solid var(--border); border-radius: 999px; padding: 0; background: var(--card); }
.seg-mini button { min-width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--text2); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0 10px; }
.seg-mini button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
@media (max-width: 399px) { .brand .n { font-size: 17px; } .wz-header .in { padding: 8px 12px; gap: 8px; } .logo { width: 36px; height: 36px; } .brand .by { font-size: 9px; letter-spacing: 1px; } }
@media (min-width: 600px) { .hdr-date { display: inline; } }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: var(--tab-h); text-decoration: none; color: var(--text2); font-size: 11.5px; font-weight: 600; position: relative; padding: 0 2px; text-align: center; }
.tabs a .ic { width: 23px; height: 23px; }
.tabs a[aria-current="page"] { color: var(--gold-text); }

}
case "saveUsual": {

if (!u.ok) { var ue = document.getElementById("usual-err"); ue.textContent = t("err_" + u.err); ue.hidden = false; return; }

}
case "copySettle": {

}
case "addPlace": openPlaceForm(null, false); break;
case "editPlace": openPlaceForm(id, false); break;
case "savePlace": savePlace(); break;
case "delPlace": {
var dp = L.deletePlace(state, id);
if (!dp.place) break;
state = dp.state; save(); render();
toast(t("placeDeleted", { x: dp.place.item }), t("undo"), function () {
state.places.splice(Math.min(dp.index, state.places.length), 0, dp.place);

});

}
case "markChecked": state.pricesChecked = today; save(); render(); toast(t("markedChecked")); break;
case "priceReset": {
var o = state.prices[cur()] || {}; delete o[id]; state.prices[cur()] = o; save();
var inp = document.getElementById("p-" + id); if (inp) inp.value = defaultPrices()[id] == null ? "" : defaultPrices()[id];
el.hidden = true; toast(t("priceResetOne", { i: ingName(id) }));

}
case "pricesResetAsk": ui.confirm = "pricesReset"; render(); break;
case "pricesResetYes": state.prices[cur()] = {}; ui.confirm = null; save(); render(); toast(t("pricesResetDone")); break;
case "addIng": openIngForm(null); break;
case "editIng": openIngForm(id); break;
case "saveIng": saveIngForm(); break;
case "delIng": {
var di2 = L.deleteCustomIngredient(state, id), ing = state.customIngredients.filter(function (x) { return x.id === id; })[0];
if (!di2.ok) { ui.ingMsg = t("ingInUse", { i: ing ? ing.name : id, r: di2.recipes.join(", ") }); render(); window.scrollTo(0, 0); break; }
var beforeIng = L.clone(state);
state = di2.state; ui.ingMsg = null; save(); render();
toast(t("ingredientDeleted", { i: ing.name }), t("undo"), function () { state = beforeIng; save(); render(); });
break;
}
case "set": applySetting(el.getAttribute("data-key"), v); break;
case "people": {
var pp = L.validatePeople(state.settings.people + (+el.getAttribute("data-d")), CONFIG.maxPeople);
if (pp.ok) { state.settings.people = pp.value; save(); render(); }
break;
}
case "saveBudget": {
var bb = L.parseMoney(document.getElementById("set-budget").value);
if (!bb.ok) { var be = document.getElementById("budget-err"); be.textContent = t("err_" + bb.err); be.hidden = false; return; }
state.settings.budget = bb.value; save(); render(); toast(t("saved")); break;
}
case "saveMess": {
var mv = document.getElementById("set-mess").value.trim(), md = document.getElementById("set-messday").value;
var mb = mv ? L.parseMoney(mv) : { ok: true, value: null };
if (!mb.ok) { var me = document.getElementById("mess-err"); me.textContent = t("err_" + mb.err); me.hidden = false; return; }
state.settings.messBill = mb.value; state.settings.messPaidOn = md ? +md : null; save(); render(); toast(t("saved")); break;
}
case "clearMess": state.settings.messBill = null; state.settings.messPaidOn = null; save(); render(); break;
case "slotPreset": changeSlots(L.presetSlots(+v, slots())); break;
case "slotAdd": {
if (slots().length >= L.MAX_SLOTS) break;
var nx = L.nextSlotToAdd(slots());   // v1.1.1: Evening snack → Mid-morning → Post-workout, in a natural position
var ns = nx.id ? L.makeSlot(nx.id) : L.makeSlot("m" + L.newId("").slice(-6), t("mealN", { n: slots().length + 1 }));
changeSlots(L.insertSlot(slots(), ns, nx.index), t("mealAdded", { m: slotName(ns) }));
break;
}
case "slotRemove": if (slots().length > L.MIN_SLOTS) changeSlots(slots().filter(function (s) { return s.id !== id; })); break;
case "slotsYes": if (ui.pendingSlots) { ui.slotConfirmed = true; var ps = ui.pendingSlots; ui.pendingSlots = null; changeSlots(ps); } break;
case "slotUp": case "slotDown": {
state.mealSlots = L.moveSlot(slots(), id, act === "slotUp" ? -1 : 1); state.plans = L.reshapePlans(state.plans, state.mealSlots); save(); render();
var mb2 = document.querySelector('[data-act="' + act + '"][data-id="' + id + '"]'); if (mb2 && !mb2.disabled) mb2.focus({ preventScroll: true });
break;
}
case "catToggle": {
var hc = state.hiddenCategories, pos = hc.indexOf(id);
if (pos >= 0) hc.splice(pos, 1); else hc.push(id);

}
case "catAdd": openCatForm(null); break;
case "catEdit": openCatForm(id); break;
case "cfIcon": ui.cf.icon = v; el.parentNode.querySelectorAll(".icon-choice").forEach(function (c) { c.setAttribute("aria-pressed", String(c === el)); }); break;

case "catDeleteYes": doCatDelete(ui.confirm.slice(7), ""); break;

case "restorePick": ui.restoreErr = null; document.getElementById("file-backup").click(); break;
case "restoreYes":

case "groceryCsv": download("grocery-list-" + weekKey() + ".csv", L.groceryToCSV(grocery(weekKey()), ingName, function (u) { return unitLabel(u); }), "text/csv;charset=utf-8"); break;
case "resetYes": {
if ((document.getElementById("reset-in").value || "").trim() !== "RESET") { document.getElementById("reset-err").hidden = false; return; }
state = L.defaultState(CONFIG, REGION); ui.fr = { step: 1 }; ui.weekOffset = 0; ui.day = null; save(); go("#week"); render(); toast(t("resetDone")); break;
}
}
});
function applySetting(key, v) {
var st = state.settings;
if (key === "theme") { setTheme(v, true); render(); return; }
if (key === "setup" || key === "diet") { st[key] = v; ui.rf = null; }
else if (key === "weekStartsOn") { state = L.rekeyWeekStart(state, +v === 0 ? 0 : 1); ui.weekOffset = 0; ui.day = null; }   // item 5
else if (key === "lang") st.lang = v;
save(); render();
}
var composing = false, searchTimer = null;
function runSearch(el) {
var kind = el.getAttribute("data-search");
if (kind === "recipes") { ui.query = el.value; updateRecipeResults(); }
else if (kind === "places") { ui.placeQ = el.value; updatePlaceResults(); }
else if (kind === "ing") { ui.ingQ = el.value; var box = document.getElementById("ing-results"); if (box) box.innerHTML = ingResults(); }
}
function scheduleSearch(el) { clearTimeout(searchTimer); searchTimer = setTimeout(function () { runSearch(el); }, 150); }
document.addEventListener("compositionstart", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-search")) composing = true; });
document.addEventListener("compositionend", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-search")) { composing = false; scheduleSearch(e.target); } });
document.addEventListener("input", function (e) {
var el = e.target;
if (el.hasAttribute && el.hasAttribute("data-search")) { if (composing || e.isComposing) return; scheduleSearch(el); }
if (el.hasAttribute && el.hasAttribute("data-nr-live")) updateLiveCost();
});
document.addEventListener("change", function (e) {
var el = e.target;
if (el.hasAttribute("data-tick")) {
var key = weekKey(), id = el.getAttribute("data-tick");
state.ticks[key] = state.ticks[key] || {};
if (el.checked) state.ticks[key][id] = true; else delete state.ticks[key][id];
if (!Object.keys(state.ticks[key]).length) delete state.ticks[key];
save();
var li = el.closest("li"); if (li) li.classList.toggle("done", el.checked);
return;
}
if (el.hasAttribute("data-price")) { savePrice(el); return; }
if (el.hasAttribute("data-nr-live")) { updateLiveCost(); return; }
if (el.hasAttribute("data-slotname") || el.hasAttribute("data-slotnameml") || el.hasAttribute("data-slotcat")) {
var sid = el.getAttribute("data-slotname") || el.getAttribute("data-slotnameml") || el.getAttribute("data-slotcat"), s = slotById(sid);
if (!s) return;
if (el.hasAttribute("data-slotname")) s.name = el.value.trim().slice(0, 30);
else if (el.hasAttribute("data-slotnameml")) s.nameMl = el.value.trim().slice(0, 30);
else s.defaultCat = el.value;
if (!s.name && L.BUILTIN_SLOTS.indexOf(s.id) < 0) s.name = t("mealN", { n: slots().indexOf(s) + 1 });
save(); toast(t("saved"));
return;
}
var setting = el.getAttribute("data-setting");
if (setting === "city") { state.settings.city = el.value; save(); render(); return; }
if (setting === "currency") { state.settings.currency = el.value; save(); render(); return; }
if (setting === "cups") { state.settings.cups = el.checked; save(); render(); return; }
if (el.id === "file-backup" && el.files && el.files[0]) {
var fr = new FileReader();
fr.onload = function () {
var r = L.validateImport(String(fr.result), CONFIG, REGION);
if (r.ok) { ui.restoreData = r.data; ui.restoreNote = r.notes ? r.notes.removedPlaceholderMeals : 0; ui.restoreErr = null; } else { ui.restoreData = null; ui.restoreErr = r.err === "json" || r.err === "bad" ? "bad" : r.err; }
render();
};
fr.readAsText(el.files[0]);
}
});
document.addEventListener("keydown", function (e) {
if (e.key === "Escape" && !$ov.hidden) closeOverlay();
else if (e.key === "Escape" && ui.menu) { ui.menu = null; render(); }
if (e.key === "Enter" && e.target.id === "sp-amt") { e.preventDefault(); saveSpend(); }

if (!savePrice(e.target)) return;
var all = Array.prototype.slice.call(document.querySelectorAll("input[data-price]")), nx = all[all.indexOf(e.target) + 1];
if (nx) { nx.focus(); try { nx.select(); } catch (x) { /* ignore */ } }
}
});

render();
})();</script>
